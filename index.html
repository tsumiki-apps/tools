<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>つみき tools</title>
<meta name="description" content="つみきの配布用ツール置き場。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F2EE; --surface:#ECE9E3; --ink:#242321; --muted:#77736B;
    --hair:#D8D4CC; --ghost:#BEB9B0; --control:#F8F7F4;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    padding:0 24px calc(48px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px; margin:0 auto;}
  svg{display:block; stroke:var(--ink); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  header{padding:56px 0 40px; text-align:center;}
  .kicker{font-size:12px; font-weight:700; letter-spacing:.16em; color:var(--muted); margin-bottom:10px;}
  h1{font-size:26px; font-weight:700; letter-spacing:.04em;}
  header p{margin-top:10px; font-size:13.5px; color:var(--muted);}
  .tool{display:flex; align-items:center; gap:14px; background:var(--control);
    border:1px solid var(--hair); border-radius:24px; padding:20px 18px; margin-bottom:14px;
    text-decoration:none; color:var(--ink); transition:transform .12s ease;}
  .tool:active{transform:scale(.98);}
  .tool .ic{width:46px; height:46px; border-radius:50%; border:1.5px solid var(--hair);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .tool .ic svg{width:22px; height:22px;}
  .tool .t{font-size:16px; font-weight:700;}
  .tool .d{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .tool .go{margin-left:auto; flex-shrink:0;}
  .tool .go svg{width:16px; height:16px; stroke:var(--ghost);}
  footer{margin-top:44px; text-align:center; font-size:12px; color:var(--ghost);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">TSUMIKI TOOLS</p>
    <h1>つみき tools</h1>
    <p>小さな道具の置き場です。</p>
  </header>

  <a class="tool" href="kouban.html">
    <span class="ic">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="M3.5 10.5h17"/><path d="M10.5 10.5V19.5"/><path d="M14 7.5h3"/></svg>
    </span>
    <span>
      <span class="t">香盤メーカー</span>
      <span class="d" style="display:block">稽古のNGから「今日できる場面」を出す</span>
    </span>
    <span class="go"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
  </a>

  <a class="tool" href="mazeiro.html">
    <span class="ic">
      <svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 1 9-9c0 2-1.5 3-3 3h-2a2.5 2.5 0 0 0-2 4c.5.8 0 2-2 2z"/><circle cx="8" cy="10" r=".6"/><circle cx="12" cy="7.5" r=".6"/><circle cx="16" cy="10" r=".6"/></svg>
    </span>
    <span>
      <span class="t">まぜいろ</span>
      <span class="d" style="display:block">カラー剤の配合計算（比率→グラム・2剤の倍率）</span>
    </span>
    <span class="go"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
  </a>

  <a class="tool" href="dougu-catalog.html">
    <span class="ic">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
    </span>
    <span>
      <span class="t">道具のカタログ</span>
      <span class="d" style="display:block">介護・福祉の現場向け・設計図あつめ</span>
    </span>
    <span class="go"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
  </a>

  <footer>つみき</footer>
</div>
</body>
</html>
