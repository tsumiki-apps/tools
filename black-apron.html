<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon-black-apron.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="黒エプロン">
<title>ブラックエプロンノート</title>
<meta name="description" content="飲んだコーヒーを記録しながら、豆の知識を覚えるノート。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F2EE; --surface:#ECE9E3; --ink:#242321; --muted:#77736B;
    --hair:#D8D4CC; --ghost:#BEB9B0; --control:#F8F7F4;
    --tabh:64px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{overflow-x:hidden;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    padding:0 18px calc(var(--tabh) + 16px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px; margin:0 auto;}
  svg{display:block; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}

  header{padding:20px 0 10px; display:flex; align-items:flex-end; gap:12px;}
  header .ttl{flex:1; min-width:0;}
  .kicker{font-size:11px; font-weight:700; letter-spacing:.16em; color:var(--muted);}
  h1{font-size:21px; font-weight:700; letter-spacing:.03em; margin-top:2px;}
  .iconbtn{width:38px; height:38px; border-radius:50%; border:1px solid var(--hair);
    background:var(--control); color:var(--ink); display:flex; align-items:center;
    justify-content:center; flex-shrink:0; cursor:pointer;}
  .iconbtn svg{width:17px; height:17px;}

  .card{background:var(--control); border:1px solid var(--hair); border-radius:20px;
    padding:16px; margin-bottom:12px;}
  .card.tap{cursor:pointer; transition:transform .12s ease;}
  .card.tap:active{transform:scale(.985);}
  h2{font-size:13px; font-weight:700; letter-spacing:.04em; margin:16px 0 8px; color:var(--muted);}
  h2:first-child{margin-top:4px;}
  .sub{font-size:12px; color:var(--muted); line-height:1.65;}
  .row{display:flex; align-items:center; gap:10px;}
  .grow{flex:1; min-width:0;}
  .btn{display:block; width:100%; padding:14px; border-radius:16px; border:1px solid var(--ink);
    background:var(--ink); color:var(--paper); font:inherit; font-size:15px; font-weight:700;
    cursor:pointer; text-align:center;}
  .btn:active{opacity:.85;}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--hair);}
  .btn.warn{background:transparent; color:var(--muted); border-color:var(--hair);}
  .stars{letter-spacing:.06em; font-size:12px;}
  .empty{text-align:center; color:var(--ghost); font-size:13px; padding:34px 10px; line-height:1.9;}
  .pill{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
    border:1px solid var(--hair); color:var(--muted); background:var(--paper);}
  .pill.solid{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  /* ---- tabs ---- */
  nav{position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:rgba(244,242,238,.94); backdrop-filter:blur(12px);
    border-top:1px solid var(--hair); padding-bottom:env(safe-area-inset-bottom);}
  nav .inner{max-width:560px; margin:0 auto; display:flex; height:var(--tabh);}
  nav button{flex:1; background:none; border:0; font:inherit; color:var(--ghost);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    cursor:pointer; padding:0;}
  nav button svg{width:20px; height:20px;}
  nav button span{font-size:10px; font-weight:700;}
  nav button.on{color:var(--ink);}

  /* ---- home ---- */
  .stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:8px;}
  .stat{background:var(--control); border:1px solid var(--hair); border-radius:18px;
    padding:11px 4px 9px; text-align:center;}
  .stat b{display:block; font-size:21px; font-weight:700; line-height:1.15;}
  .stat b small{font-size:12px; color:var(--muted); font-weight:400;}
  .stat span{font-size:10.5px; color:var(--muted);}
  .big{display:flex; align-items:center; gap:13px; background:var(--ink); color:var(--paper);
    border-radius:22px; padding:15px 15px; margin-bottom:8px; cursor:pointer;
    transition:transform .12s ease;}
  .big:active{transform:scale(.985);}
  .big .ic{width:42px; height:42px; border-radius:50%; border:1.5px solid rgba(244,242,238,.35);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .big .ic svg{width:20px; height:20px; stroke-width:1.6;}
  .big .t{font-size:16px; font-weight:700; line-height:1.3;}
  .big .d{font-size:11.5px; opacity:.68; margin-top:2px;}
  .duo{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:0;}
  /* ホームだけ、iPhone の1画面いっぱいに広がる。
     余ったぶんは 記録する／クイズ・豆／さいきん が受け持ち、上限で伸びすぎを止める。 */
  #view.fill{display:flex; flex-direction:column; gap:9px;
    min-height:calc(100vh - var(--hh,86px) - var(--tabh) - 16px - env(safe-area-inset-bottom));
    min-height:calc(100dvh - var(--hh,86px) - var(--tabh) - 16px - env(safe-area-inset-bottom));}
  #view.fill .stats{margin-bottom:0; flex:0 0 auto;}
  #view.fill .big{margin-bottom:0; flex:1 1 0; min-height:76px; max-height:126px;}
  #view.fill .duo{flex:1.55 1 0; min-height:116px; max-height:172px;}
  #view.fill .recent{flex:1.3 1 0; min-height:0; display:flex; flex-direction:column;}
  #view.fill .recent h2{margin:3px 0 7px;}
  #view.fill .recent .list{flex:1 1 auto; display:flex; flex-direction:column; gap:7px; min-height:0;}
  #view.fill .recent .mini{margin-bottom:0; flex:1 1 0; min-height:44px; max-height:66px;}
  .nonote{display:flex; align-items:center; justify-content:center; text-align:center;
    border:1px dashed var(--hair); border-radius:16px; color:var(--ghost); font-size:12.5px;
    line-height:1.7; padding:10px; flex:1 1 auto;}
  .tile{background:var(--control); border:1px solid var(--hair); border-radius:22px;
    padding:14px 13px; cursor:pointer; transition:transform .12s ease;
    display:flex; flex-direction:column; justify-content:center;}
  .tile:active{transform:scale(.985);}
  .tile .ic{width:36px; height:36px; border-radius:50%; border:1px solid var(--hair);
    display:flex; align-items:center; justify-content:center; margin-bottom:8px;}
  .tile .ic svg{width:19px; height:19px;}
  .tile .t{font-size:15px; font-weight:700;}
  .tile .d{font-size:11px; color:var(--muted); margin-top:1px;}

  /* ---- avatar ---- */
  .av{border-radius:50%; flex-shrink:0; overflow:hidden; display:flex; align-items:center;
    justify-content:center; background:var(--surface); position:relative;}
  .av img.mine{width:100%; height:100%; object-fit:cover; display:block;}
  /* 公式のパッケージ写真。袋は縦長なので全体が入るように収め、届いたら線画を隠す。
     写真が来たら地を白くして袋を見やすくし、焙煎度は内側の輪の色で残す。 */
  .av img.pkg{position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; padding:15%; display:block;}
  .av.haspkg svg{display:none;}
  /* .av.blonde などが後ろにあるので、こちらは2クラス重ねで specificity を上げる */
  .av.blonde.haspkg{background:#FCFBF9; box-shadow:inset 0 0 0 3px #D8CBB4;}
  .av.medium.haspkg{background:#FCFBF9; box-shadow:inset 0 0 0 3px #A98A6B;}
  .av.dark.haspkg{background:#FCFBF9; box-shadow:inset 0 0 0 3px #463A32;}
  .av.mine.haspkg{background:#FCFBF9; box-shadow:inset 0 0 0 3px #8C837A;}
  .av svg{stroke:#fff; stroke-width:1.6;}
  .av.blonde{background:#D8CBB4;} .av.medium{background:#A98A6B;} .av.dark{background:#463A32;}
  .av.mine{background:#8C837A;}

  /* ---- flavor icons ---- */
  .ficons{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .fi{width:31px; height:31px; border-radius:50%; border:1px solid var(--hair);
    background:var(--paper); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .fi svg{width:18px; height:18px; stroke-width:1.5; color:var(--ink);}
  .legend{display:flex; gap:14px; justify-content:center; margin:0 0 14px;}
  .legend span{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted);}
  .legend i{width:13px; height:13px; border-radius:50%; display:block;}
  .filab{display:flex; flex-direction:column; align-items:center; gap:5px; width:80px;}
  .filab .fi{width:44px; height:44px; background:var(--control);}
  .filab .fi svg{width:22px; height:22px;}
  .filab span{font-size:10px; color:var(--muted); text-align:center; line-height:1.4;}
  .figrid{display:flex; flex-wrap:wrap; gap:10px 4px;}

  /* ---- inputs ---- */
  input[type=text],input[type=date],input[type=search],select,textarea{
    width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--control);
    border:1px solid var(--hair); border-radius:14px; padding:11px 13px; -webkit-appearance:none;}
  textarea{resize:vertical; min-height:70px; line-height:1.7;}
  label.fl{display:block; font-size:12px; font-weight:700; color:var(--muted); margin:14px 0 6px;}
  label.fl:first-of-type{margin-top:0;}
  .half{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .filters{display:flex; gap:6px; overflow-x:auto; padding:2px 0 12px;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0; font-size:12px; font-weight:700; padding:7px 13px; border-radius:999px;
    border:1px solid var(--hair); background:var(--control); color:var(--muted); cursor:pointer;}
  .chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .bean{display:flex; align-items:center; gap:12px; padding:11px 13px; background:var(--control);
    border:1px solid var(--hair); border-radius:20px; margin-bottom:9px; cursor:pointer;
    transition:transform .12s ease;}
  .bean:active{transform:scale(.985);}
  .bean .av{width:44px; height:44px;}
  .bean .av svg{width:20px; height:20px;}
  .bean .nm{font-size:14.5px; font-weight:700; line-height:1.4;}
  .bean .ck{position:absolute; right:-1px; bottom:-1px; width:15px; height:15px; border-radius:50%;
    background:var(--ink); border:2px solid var(--control); display:flex; align-items:center; justify-content:center;}
  .bean .ck svg{width:8px; height:8px; stroke:var(--paper); stroke-width:3;}

  .meter{display:inline-flex; gap:3px; align-items:center; vertical-align:middle;}
  .meter i{width:16px; height:5px; border-radius:3px; background:var(--hair); display:block;}
  .meter i.on{background:var(--ink);}
  .kv{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--hair); font-size:13px;}
  .kv:last-child{border-bottom:0;}
  .kv .k{width:72px; flex-shrink:0; color:var(--muted); font-size:12px; font-weight:700; padding-top:1px;}
  .kv .v{flex:1; min-width:0;}
  .tags{display:flex; flex-wrap:wrap; gap:5px;}
  .tag{font-size:11.5px; padding:4px 9px; border-radius:999px; background:var(--surface);
    border:1px solid var(--hair); color:var(--ink); font-family:inherit; cursor:pointer;}
  .tag.add{border-style:dashed; color:var(--muted); background:transparent;}

  /* ---- sheet ---- */
  .sheet{position:fixed; inset:0; z-index:60; display:none;}
  .sheet.on{display:block;}
  .sheet .veil{position:absolute; inset:0; background:rgba(36,35,33,.32);}
  .sheet .panel{position:absolute; left:0; right:0; bottom:0; max-height:92vh; overflow-y:auto;
    background:var(--paper); border-radius:26px 26px 0 0;
    padding:10px 18px calc(28px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch;}
  .sheet .panel .inner{max-width:560px; margin:0 auto;}
  .grab{width:38px; height:4px; border-radius:3px; background:var(--hair); margin:0 auto 14px;}
  .sh-h{display:flex; align-items:flex-start; gap:10px; margin-bottom:14px;}
  .sh-h h3{font-size:18px; font-weight:700; line-height:1.4; flex:1;}
  .x{width:32px; height:32px; border-radius:50%; border:1px solid var(--hair); background:var(--control);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;}
  .x svg{width:14px; height:14px;}

  .hero{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
  .hero .av{width:76px; height:76px;}
  .hero .av svg{width:34px; height:34px;}
  .photobtn{font:inherit; font-size:11.5px; font-weight:700; color:var(--muted); background:none;
    border:0; cursor:pointer; padding:4px 0; text-decoration:underline; text-underline-offset:3px;}

  /* ---- quiz ---- */
  .qprog{display:flex; gap:4px; margin-bottom:18px;}
  .qprog i{flex:1; height:4px; border-radius:3px; background:var(--hair);}
  .qprog i.on{background:var(--ink);} .qprog i.bad{background:var(--ghost);}
  .qtext{font-size:17px; font-weight:700; line-height:1.7; margin-bottom:18px;}
  .opt{display:block; width:100%; text-align:left; font:inherit; font-size:14.5px; line-height:1.6;
    background:var(--control); border:1.5px solid var(--hair); border-radius:16px; padding:14px 15px;
    margin-bottom:9px; cursor:pointer; color:var(--ink);}
  .opt.correct{border-color:var(--ink); background:var(--ink); color:var(--paper);}
  .opt.wrong{border-color:var(--ghost); background:var(--surface); color:var(--muted); text-decoration:line-through;}
  .opt.reveal{border-color:var(--ink);}
  .expl{background:var(--surface); border-radius:16px; padding:14px; font-size:13px;
    line-height:1.8; margin-bottom:12px;}
  .score{text-align:center; padding:24px 0 6px;}
  .score b{display:block; font-size:44px; font-weight:700; line-height:1.1;}
  .score span{font-size:13px; color:var(--muted);}

  /* ---- notes ---- */
  .note{display:flex; gap:11px; align-items:center; background:var(--control); border:1px solid var(--hair);
    border-radius:20px; padding:9px 11px; margin-bottom:8px; cursor:pointer;}
  .note .av{width:40px; height:40px;}
  .note .av svg{width:20px; height:20px;}
  .mini{display:flex; gap:9px; align-items:center; background:var(--control); border:1px solid var(--hair);
    border-radius:16px; padding:8px 11px; margin-bottom:7px; cursor:pointer;}
  .mini .av{width:28px; height:28px;} .mini .av svg{width:13px; height:13px;}
  .mini .dt{font-size:10.5px; color:var(--muted); font-weight:700; flex-shrink:0;}
  .mini .nm{font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .note .dt{font-size:11px; color:var(--muted); font-weight:700;}
  .note .nm{font-size:14.5px; font-weight:700; line-height:1.4;}
  .note .wd{font-size:12px; color:var(--muted); margin-top:3px; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;}
  .levelpick{display:flex; gap:7px;}
  .levelpick button{flex:1; font:inherit; font-size:12.5px; font-weight:700; padding:11px 4px;
    border-radius:14px; border:1px solid var(--hair); background:var(--control); color:var(--muted); cursor:pointer;}
  .levelpick button.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .starpick{display:flex; gap:6px;}
  .starpick button{font:inherit; font-size:22px; line-height:1; background:none; border:0;
    color:var(--hair); cursor:pointer; padding:2px;}
  .starpick button.on{color:var(--ink);}
  .steplabel{display:flex; align-items:center; gap:8px; margin:20px 0 8px;}
  .steplabel .n{width:26px; height:26px; border-radius:50%; background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .steplabel .n svg{width:14px; height:14px; stroke:var(--paper);}
  .steplabel .t{font-size:13.5px; font-weight:700;}
  .steplabel .h{font-size:11px; color:var(--muted); margin-left:auto;}
  .shot{width:100%; border-radius:18px; display:block; margin-bottom:14px;}

  .word{padding:12px 0; border-bottom:1px solid var(--hair); display:flex; gap:10px; align-items:flex-start;}
  .word:last-child{border-bottom:0;}
  .word .w{font-size:14px; font-weight:700;}
  .word .m{font-size:12.5px; color:var(--muted); line-height:1.65; margin-top:2px;}
  .del{font:inherit; font-size:11px; color:var(--ghost); background:none; border:0; cursor:pointer; flex-shrink:0;}
  .foot{text-align:center; font-size:11px; color:var(--ghost); margin-top:30px; line-height:1.9;}
  .foot:empty{margin:0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ttl">
      <p class="kicker">BLACK APRON NOTE</p>
      <h1 id="pageTitle">ブラックエプロンノート</h1>
    </div>
    <button class="iconbtn" id="gearBtn" aria-label="設定">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H2a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H8a1.6 1.6 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V8a1.6 1.6 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="view"></main>
  <p class="foot" id="foot"></p>
</div>

<nav>
  <div class="inner">
    <button data-tab="home" class="on">
      <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M9.5 20.5v-6h5v6"/></svg>
      <span>ホーム</span>
    </button>
    <button data-tab="beans">
      <svg viewBox="0 0 24 24"><g transform="rotate(35 12 12)"><ellipse cx="12" cy="12" rx="5.2" ry="8.6"/><path d="M12 3.6c-2.6 3-2.6 5.6 0 8.4s2.6 5.4 0 8.4"/></g></svg>
      <span>豆</span>
    </button>
    <button data-tab="notes">
      <svg viewBox="0 0 24 24"><path d="M6.5 3.5h8L19 8v12.5H6.5z"/><path d="M14 3.5V8h5"/><path d="M9.5 12.5h6M9.5 16h4"/></svg>
      <span>記録</span>
    </button>
    <button data-tab="quiz">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.3v.4"/><circle cx="12" cy="16.6" r=".7" fill="currentColor" stroke="none"/></svg>
      <span>クイズ</span>
    </button>
    <button data-tab="words">
      <svg viewBox="0 0 24 24"><path d="M4.5 5.5A2 2 0 0 1 6.5 3.5H19v17H6.5a2 2 0 0 0-2 2z"/><path d="M4.5 5.5v15"/><path d="M8.5 8h6.5M8.5 11.5h5"/></svg>
      <span>ことば</span>
    </button>
  </div>
</nav>

<div class="sheet" id="sheet">
  <div class="veil" data-close></div>
  <div class="panel"><div class="inner"><div class="grab"></div><div id="sheetBody"></div></div></div>
</div>

<script>
/* =========================================================================
   ブラックエプロンノート
   飲んだ一杯を記録しながら、コーヒーの知識を覚えるノート。
   豆・ことば・クイズはあとから自分で足せる。写真も端末の中だけに保存する。
   ========================================================================= */

/* ---------- 絵（線画アイコン） ---------- */
const G = {

/* 公式のパッケージ画像は、つみき側にコピーを置かず公式サーバーから直接読む。
   1枚 約190KB あるので、画面に出るぶんだけ遅れて読む（loading="lazy"）。
   読めなかったときは焙煎度の色＋豆の線画に戻る。設定で丸ごと切れる。 */
const PKG_BASE = 'https://www.starbucks.co.jp/coffee/images/';

/* 豆の丸アイコン（自分の写真 → 公式画像 → 焙煎度の色＋豆の線画 の順） */
function avatar(bean, cls=''){
  const p = S.photos[bean.id];
  const kind = isCustom(bean.id) && !R[bean.roast] ? 'mine' : (bean.roast||'medium');
  let inner;
  if(p) inner = `<img class="mine" src="${p}" alt="">`;
  else if(bean.img && S.officialImg !== false)
    inner = `${ic('bean')}<img class="pkg" data-src="${PKG_BASE}${bean.img}.png" alt="">`;
  else inner = ic('bean');
  return `<span class="av ${kind} ${cls}">${inner}</span>`;
}

/* 描いたあとに呼ぶ。画面に入った丸だけ写真を読みにいく（1枚190KBあるため）。
   届いたら地を白くし、読めなかったら線画のまま。
   ※ ブラウザ任せの loading="lazy" は、描き直したあとに読み込まれないことがあったので自前でやる。 */
const pkgIO = ('IntersectionObserver' in window) ? new IntersectionObserver((es, io)=>{
  es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); loadPkg(e.target); } });
}, {rootMargin:'300px'}) : null;

function loadPkg(img){
  if(img.dataset.loading) return;
  img.dataset.loading = '1';
  img.addEventListener('load', ()=>{ if(img.parentNode) img.parentNode.classList.add('haspkg'); }, {once:true});
  img.addEventListener('error', ()=>img.remove(), {once:true});
  img.src = img.dataset.src;
}
function syncPkg(root=document){
  root.querySelectorAll('.av img.pkg[data-src]').forEach(img=>{
    if(img.src) return;
    if(pkgIO) pkgIO.observe(img); else loadPkg(img);
  });
}
function flavorRow(bean, n=3){
  return `<span class="ficons">${bean.flavors.slice(0,n).map(f=>`<span class="fi">${ic(flavorIcon(f))}</span>`).join('')}</span>`;
}

/* 写真を選ぶ（縮小して端末内に保存） */
function pickPhoto(cb){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const max=360, sc=Math.min(1, max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        try{ cb(c.toDataURL('image/jpeg',0.72)); }catch(e){ alert('この写真は読み込めませんでした。'); }
      };
      img.onerror = ()=>alert('この写真は読み込めませんでした。');
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
}

let beanFilter = 'all', beanQuery = '';
function renderBeans(){
  const tasted = tastedIds();
  const fs = [['all','すべて'],['season','季節限定'],['blonde','ブロンド'],['medium','ミディアム'],['dark','ダーク'],

              ['tasted','飲んだ'],['mine','自分の豆']];
  const list = allBeans().filter(b=>{
    if(beanFilter==='tasted'){ if(!tasted.has(b.id)) return false; }
    else if(beanFilter==='season'){ if(!b.season) return false; }
    else if(beanFilter==='mine'){ if(!isCustom(b.id)) return false; }
    else if(['blonde','medium','dark'].includes(beanFilter)){ if(b.roast!==beanFilter) return false; }
    else if(['ラテンアメリカ','アフリカ','アジア'].includes(beanFilter)){ if(!String(b.region).includes(beanFilter)) return false; }
    if(beanQuery){
      const hay = [b.name,b.origin,b.process,...(b.flavors||[]),...(b.pairing||[]),b.story].join(' ');
      if(!hay.includes(beanQuery)) return false;
    }
    return true;

      <span><i style="background:#A98A6B"></i>ミディアム</span>

  view.querySelectorAll('[data-f]').forEach(el=>el.onclick=()=>{ beanFilter=el.dataset.f; renderBeans(); });
  view.querySelectorAll('[data-bean]').forEach(el=>el.onclick=()=>openBean(el.dataset.bean));
  document.getElementById('addBean').onclick = ()=>openBeanForm(null);
}

  openSheet(`
    <div class="hero">
      ${avatar(b)}
      <div class="grow">
        <div style="font-size:18px;font-weight:700;line-height:1.4">${esc(b.name)}</div>

          ${b.season?`<span class="pill solid">${esc(b.season)}の限定</span>`:''}</div>
        <button class="photobtn" id="photoBtn">${S.photos[id]?'写真を変える':'＋ 写真を追加'}</button>
      </div>
      <button class="x" data-close aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

      ${(b.flavors||[]).map(f=>{const g=flavorIcon(f);

    <div class="card">
      <div class="kv"><div class="k">生産地</div><div class="v">${esc(b.origin||'—')}</div></div>

      <div class="kv"><div class="k">加工法</div><div class="v">${esc(b.process||'—')}</div></div>
      <div class="kv"><div class="k">酸味</div><div class="v">${meter(b.acidity)}</div></div>

    <h2>合うフード</h2>

        || '<span class="sub">—</span>'}

    ${b.story?`<h2>この豆の話</h2><div class="card"><p style="font-size:13.5px;line-height:1.9">${esc(b.story)}</p></div>`:''}

    <h2>自分のメモ</h2>
    <textarea id="beanMemo" placeholder="研修で聞いたこと、パッケージの由来、自分なりの覚え方">${esc(S.memos[id]||'')}</textarea>
    <button class="btn ghost" id="saveMemo" style="margin-top:8px">メモを保存</button>

    <div class="card" style="margin-top:20px">
      <div class="kv"><div class="k">クイズ</div><div class="v">${st.t? `${st.c} / ${st.t} 問 正解` : 'まだ'}</div></div>
      <div class="kv"><div class="k">飲んだ</div><div class="v">${myNotes.length? `${myNotes.length} 杯` : 'まだ'}</div></div>
    </div>

    <button class="btn" id="recordThis" style="margin-top:14px">この豆を記録する</button>
    <button class="btn ghost" id="editBean" style="margin-top:8px">この豆を編集する</button>
  `);
  document.getElementById('photoBtn').onclick = ()=>pickPhoto(d=>{ S.photos[id]=d; if(save()){ openBean(id); render(); } });
  document.getElementById('saveMemo').onclick = ()=>{
    S.memos[id] = document.getElementById('beanMemo').value;
    if(save()){ const btn=document.getElementById('saveMemo'); btn.textContent='保存しました'; setTimeout(()=>btn.textContent='メモを保存',1400); }
  };

function openBeanForm(id){
  const b = id ? beanById(id) : {name:'', roast:'medium', type:'ブレンド', region:'ラテンアメリカ',
    origin:'', process:'水洗式', acidity:2, body:2, flavors:[], pairing:[], story:''};
  const custom = id ? isCustom(id) : true;
  const edited = id && !custom && S.beanEdits[id];
  openSheet(`
    ${sheetHead(id?'豆を編集する':'豆を追加する')}
    <div class="row" style="margin-bottom:16px">
      ${avatar(id?b:{id:'__new', roast:b.roast, flavors:[]})}
      <button class="photobtn grow" style="text-align:left" id="photoBtn">${(id&&S.photos[id])?'写真を変える':'＋ 写真を追加'}</button>
    </div>
    <label class="fl">名前</label>
    <input type="text" id="b_name" value="${esc(b.name)}" placeholder="例：エチオピア">
    <div class="half">
      <div><label class="fl">焙煎度</label>
        <select id="b_roast">${Object.entries(R).map(([k,v])=>`<option value="${k}" ${b.roast===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div><label class="fl">種類</label>
        <select id="b_type">${['シングルオリジン','ブレンド'].map(v=>`<option ${b.type===v?'selected':''}>${v}</option>`).join('')}</select></div>
    </div>
    <label class="fl">生産地</label>
    <input type="text" id="b_origin" value="${esc(b.origin)}" placeholder="例：エチオピア・イルガチェフェ">
    <div class="half">
      <div><label class="fl">地域</label>
        <select id="b_region">${REGIONS.map(v=>`<option ${b.region===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div><label class="fl">加工法</label>
        <select id="b_process">${PROCESSES.concat(PROCESSES.includes(b.process)?[]:[b.process]).filter(Boolean).map(v=>`<option ${b.process===v?'selected':''}>${v}</option>`).join('')}</select></div>
    </div>
    <label class="fl">酸味</label>
    <div class="levelpick" data-level="acid">${ACID_LEVEL.map((l,i)=>`<button type="button" data-v="${i+1}" class="${b.acidity===i+1?'on':''}">${l}</button>`).join('')}</div>
    <label class="fl">コク</label>
    <div class="levelpick" data-level="body">${BODY_LEVEL.map((l,i)=>`<button type="button" data-v="${i+1}" class="${b.body===i+1?'on':''}">${l}</button>`).join('')}</div>
    <label class="fl">風味（「、」で区切る）</label>
    <input type="text" id="b_flavors" value="${esc((b.flavors||[]).join('、'))}" placeholder="ベリー、フローラル、レモン">
    <label class="fl">合うフード（「、」で区切る）</label>
    <input type="text" id="b_pairing" value="${esc((b.pairing||[]).join('、'))}" placeholder="レモンケーキ、ベリーのタルト">
    <label class="fl">この豆の話</label>
    <textarea id="b_story" placeholder="産地の話、パッケージの由来など">${esc(b.story||'')}</textarea>
    <button class="btn" id="saveBean" style="margin-top:20px">保存する</button>
    ${custom&&id?`<button class="btn warn" id="delBean" style="margin-top:8px">この豆を削除</button>`:''}
    ${edited?`<button class="btn warn" id="resetBean" style="margin-top:8px">はじめの内容に戻す</button>`:''}
  `);
  let pendingPhoto = null;
  document.getElementById('photoBtn').onclick = ()=>pickPhoto(d=>{
    pendingPhoto = d;
    const av = sheetBody.querySelector('.av'); av.innerHTML = `<img src="${d}" alt="">`;
    document.getElementById('photoBtn').textContent = '写真を変える';
  });
  sheetBody.querySelectorAll('[data-level]').forEach(g=>g.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{ g.querySelectorAll('button').forEach(x=>x.classList.remove('on')); btn.classList.add('on'); };
  }));
  const lvl = n => { const el = sheetBody.querySelector(`[data-level="${n}"] button.on`); return el?+el.dataset.v:2; };

  document.getElementById('saveBean').onclick = ()=>{
    const name = document.getElementById('b_name').value.trim();
    if(!name){ alert('名前を入れてください。'); return; }
    const data = {
      name, roast: document.getElementById('b_roast').value,
      type: document.getElementById('b_type').value,
      origin: document.getElementById('b_origin').value.trim(),
      region: document.getElementById('b_region').value,
      process: document.getElementById('b_process').value,
      acidity: lvl('acid'), body: lvl('body'),
      flavors: splitList(document.getElementById('b_flavors').value),
      pairing: splitList(document.getElementById('b_pairing').value),
      story: document.getElementById('b_story').value.trim(),
    };
    let newId = id;
    if(!id){ newId = 'u_'+uid(); S.customBeans.push(Object.assign({id:newId}, data)); }
    else if(isCustom(id)){ S.customBeans = S.customBeans.map(x=>x.id===id?Object.assign({id}, data):x); }
    else { S.beanEdits[id] = data; }
    if(pendingPhoto) S.photos[newId] = pendingPhoto;
    if(save()){ closeSheet(); openBean(newId); render(); }
  };
  const db = document.getElementById('delBean');
  if(db) db.onclick = ()=>{
    if(!confirm('この豆を削除します。よろしいですか？（記録は残ります）')) return;
    S.customBeans = S.customBeans.filter(x=>x.id!==id); delete S.photos[id]; delete S.memos[id];
    if(save()){ closeSheet(); render(); }
  };
  const rb = document.getElementById('resetBean');
  if(rb) rb.onclick = ()=>{
    if(!confirm('編集した内容を消して、はじめの内容に戻します。')) return;
    delete S.beanEdits[id];
    if(save()){ closeSheet(); openBean(id); render(); }
  };
}

function miniCard(n){
  const b = n.beanId ? beanById(n.beanId) : null;
  const name = b ? b.name : (n.beanName||'コーヒー');
  const av = n.photo ? `<span class="av"><img src="${n.photo}" alt=""></span>`
                     : (b ? avatar(b) : `<span class="av mine">${ic('cup')}</span>`);
  return `<div class="mini" data-note="${n.id}">${av}
    <span class="dt">${fmtDate(n.date)}</span>
    <span class="nm grow">${esc(name)}</span>
    <span class="stars">${'★'.repeat(n.rating||0)}</span></div>`;
}
function noteCard(n){
  const b = n.beanId ? beanById(n.beanId) : null;
  const name = b ? b.name : (n.beanName||'コーヒー');
  const words = [...(n.aroma||[]), ...(n.acidTags||[]), ...(n.bodyTags||[]), ...(n.flavorTags||[])];
  const av = n.photo ? `<span class="av"><img src="${n.photo}" alt=""></span>`
                     : (b ? avatar(b) : `<span class="av mine">${ic('cup')}</span>`);
  return `<div class="note" data-note="${n.id}">
    ${av}
    <span class="grow">
      <span class="dt" style="display:block">${fmtDate(n.date)}${n.brew?`・${esc(n.brew)}`:''}</span>
      <span class="nm" style="display:block">${esc(name)}</span>
      ${n.word?`<span class="wd" style="display:block">${esc(n.word)}</span>`
              :(words.length?`<span class="wd" style="display:block">${esc(words.slice(0,3).join('・'))}</span>`:'')}
    </span>
    <span class="stars">${'★'.repeat(n.rating||0)}</span>
  </div>`;
}
function renderNotes(){
  const list = S.notes.slice().sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  view.innerHTML = `
    <button class="btn" id="newNote">＋ 記録する</button>
    ${list.length ? `<h2>これまで（${list.length}）</h2>${list.map(noteCard).join('')}`
      : `<p class="empty">まだ記録がありません。<br>1杯ずつ、言葉にしていきましょう。</p>`}
  `;
  document.getElementById('newNote').onclick = ()=>openNoteForm();
  view.querySelectorAll('[data-note]').forEach(el=>el.onclick=()=>openNoteDetail(el.dataset.note));
}

function chipRow(name, key, selected){
  const arr = vocabOf(key);
  return `<div class="tags" data-chips="${name}" data-vkey="${key}">${
    arr.map(v=>`<button type="button" class="tag" data-v="${esc(v)}"${selected.includes(v)
      ?' style="background:var(--ink);color:var(--paper);border-color:var(--ink)"':''}>${esc(v)}</button>`).join('')
  }<button type="button" class="tag add" data-add="1">＋</button></div>`;
}

function openNoteForm(editId, presetBean){
  const n = editId ? S.notes.find(x=>x.id===editId) : null;
  const d = n || {date:todayStr(), beanId:presetBean||'', beanName:'', brew:'ドリップ',
                  aroma:[], aromaNote:'', acid:2, acidTags:[], body:2, bodyTags:[],
                  flavorTags:[], food:'', word:'', rating:0, photo:''};
  const beans = allBeans();
  openSheet(`
    ${sheetHead(n?'記録を編集':'記録する')}
    <div id="photoWrap">${d.photo?`<img class="shot" src="${d.photo}" alt="">`:''}</div>
    <button class="btn ghost" id="photoBtn" style="margin-bottom:4px">${d.photo?'写真を変える':'＋ 写真を撮る・選ぶ'}</button>

    <label class="fl">日付</label>
    <input type="date" id="f_date" value="${esc(d.date)}">
    <label class="fl">豆</label>
    <select id="f_bean">
      <option value="">— 選んでください —</option>
      ${beans.map(b=>`<option value="${b.id}" ${d.beanId===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
      <option value="__other" ${(!d.beanId&&d.beanName)?'selected':''}>その他（自分で書く）</option>
    </select>
    <input type="text" id="f_beanName" placeholder="豆の名前" value="${esc(d.beanName)}"
      style="margin-top:8px;display:${(!d.beanId&&d.beanName)?'block':'none'}">
    <label class="fl">いれ方</label>
    <div class="row">
      <select id="f_brew" class="grow">${brewList().map(b=>`<option ${d.brew===b?'selected':''}>${esc(b)}</option>`).join('')}</select>
      <button class="tag add" id="addBrew" style="padding:10px 14px">＋</button>
    </div>

    <div class="steplabel"><span class="n">${ic('nose')}</span><span class="t">香り</span><span class="h">かいでから飲む</span></div>
    ${chipRow('aroma','aroma', d.aroma)}
    <input type="text" id="f_aromaNote" placeholder="ほかに感じた香り" value="${esc(d.aromaNote)}" style="margin-top:8px">

    <div class="steplabel"><span class="n">${ic('drop')}</span><span class="t">酸味</span><span class="h">音を立ててすする</span></div>
    <div class="levelpick" data-level="acid">${ACID_LEVEL.map((l,i)=>`<button type="button" data-v="${i+1}" class="${d.acid===i+1?'on':''}">${l}</button>`).join('')}</div>
    <div style="margin-top:8px">${chipRow('acidTags','acidity', d.acidTags)}</div>

    <div class="steplabel"><span class="n">${ic('tongue')}</span><span class="t">コク</span><span class="h">口の中全体に広げる</span></div>
    <div class="levelpick" data-level="body">${BODY_LEVEL.map((l,i)=>`<button type="button" data-v="${i+1}" class="${d.body===i+1?'on':''}">${l}</button>`).join('')}</div>
    <div style="margin-top:8px">${chipRow('bodyTags','body', d.bodyTags)}</div>

    <div class="steplabel"><span class="n">${ic('pen')}</span><span class="t">風味</span><span class="h">自分の言葉にする</span></div>
    ${chipRow('flavorTags','flavor', d.flavorTags)}
    <textarea id="f_word" placeholder="この一杯を、自分の言葉でひとこと" style="margin-top:10px">${esc(d.word)}</textarea>

    <label class="fl">合わせたフード</label>
    <input type="text" id="f_food" placeholder="例：シナモンロール" value="${esc(d.food)}">
    <label class="fl">好み</label>
    <div class="starpick" id="f_rating">${[1,2,3,4,5].map(i=>`<button type="button" data-v="${i}" class="${i<=(d.rating||0)?'on':''}">★</button>`).join('')}</div>

    <button class="btn" id="saveNote" style="margin-top:22px">保存する</button>
    ${n?`<button class="btn warn" id="delNote" style="margin-top:8px">この記録を削除</button>`:''}
  `);

  let photo = d.photo || '';
  document.getElementById('photoBtn').onclick = ()=>pickPhoto(p=>{
    photo = p;
    document.getElementById('photoWrap').innerHTML = `<img class="shot" src="${p}" alt="">`;
    document.getElementById('photoBtn').textContent = '写真を変える';
  });
  const selBean = document.getElementById('f_bean');
  selBean.onchange = ()=>{ document.getElementById('f_beanName').style.display = selBean.value==='__other'?'block':'none'; };
  document.getElementById('addBrew').onclick = ()=>{
    const v = prompt('いれ方の名前'); if(!v || !v.trim()) return;
    S.brews.push(v.trim()); if(!save()) return;
    const sel = document.getElementById('f_brew');
    sel.insertAdjacentHTML('beforeend', `<option>${esc(v.trim())}</option>`); sel.value = v.trim();
  };

  function bindChips(){
    sheetBody.querySelectorAll('[data-chips]').forEach(g=>{
      g.querySelectorAll('button').forEach(btn=>{
        if(btn.dataset.add){
          btn.onclick = ()=>{
            const v = prompt('ことばを追加'); if(!v || !v.trim()) return;
            const key = g.dataset.vkey;
            if(!vocabOf(key).includes(v.trim())){ S.customVocab[key].push(v.trim()); if(!save()) return; }
            btn.insertAdjacentHTML('beforebegin',
              `<button type="button" class="tag" data-v="${esc(v.trim())}" style="background:var(--ink);color:var(--paper);border-color:var(--ink)">${esc(v.trim())}</button>`);
            bindChips();
          };
        }else{
          btn.onclick = ()=>{
            const on = btn.style.background !== '';
            btn.style.background = on?'':'var(--ink)';
            btn.style.color = on?'':'var(--paper)';
            btn.style.borderColor = on?'':'var(--ink)';
          };
        }
      });
    });
  }
  bindChips();
  sheetBody.querySelectorAll('[data-level]').forEach(g=>g.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{ g.querySelectorAll('button').forEach(x=>x.classList.remove('on')); btn.classList.add('on'); };
  }));
  const rt = document.getElementById('f_rating');
  rt.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{ const v=+btn.dataset.v; rt.querySelectorAll('button').forEach(x=>x.classList.toggle('on', +x.dataset.v<=v)); };
  });

  const readChips = name => Array.from(sheetBody.querySelectorAll(`[data-chips="${name}"] button`))
    .filter(b=>!b.dataset.add && b.style.background!=='').map(b=>b.dataset.v);
  const readLevel = name => { const b = sheetBody.querySelector(`[data-level="${name}"] button.on`); return b?+b.dataset.v:2; };

  document.getElementById('saveNote').onclick = ()=>{
    const bid = selBean.value;
    const rec = {
      id: n?n.id:uid(),
      date: document.getElementById('f_date').value || todayStr(),
      beanId: (bid && bid!=='__other') ? bid : '',
      beanName: bid==='__other' ? document.getElementById('f_beanName').value.trim() : '',
      brew: document.getElementById('f_brew').value,
      aroma: readChips('aroma'), aromaNote: document.getElementById('f_aromaNote').value.trim(),
      acid: readLevel('acid'), acidTags: readChips('acidTags'),
      body: readLevel('body'), bodyTags: readChips('bodyTags'),
      flavorTags: readChips('flavorTags'),
      food: document.getElementById('f_food').value.trim(),
      word: document.getElementById('f_word').value.trim(),
      rating: rt.querySelectorAll('button.on').length,
      photo,
    };
    if(!rec.beanId && !rec.beanName){ alert('豆を選ぶか、名前を書いてください。'); return; }
    if(n) S.notes = S.notes.map(x=>x.id===rec.id?rec:x); else S.notes.push(rec);
    if(save()){ closeSheet(); render(); }
  };
  const del = document.getElementById('delNote');
  if(del) del.onclick = ()=>{
    if(!confirm('この記録を削除します。よろしいですか？')) return;
    S.notes = S.notes.filter(x=>x.id!==editId);
    if(save()){ closeSheet(); render(); }
  };
}

function openNoteDetail(id){
  const n = S.notes.find(x=>x.id===id); if(!n) return;
  const b = n.beanId ? beanById(n.beanId) : null;
  const tagline = arr => arr && arr.length ? `<span class="tags">${arr.map(v=>`<span class="tag" style="cursor:default">${esc(v)}</span>`).join('')}</span>` : '<span class="sub">—</span>';
  const subTags = arr => arr && arr.length ? `<div style="margin-top:6px">${tagline(arr)}</div>` : '';
  openSheet(`
    ${sheetHead(b?b.name:(n.beanName||'コーヒー'))}
    ${n.photo?`<img class="shot" src="${n.photo}" alt="">`:''}
    <div class="row" style="margin-bottom:14px">
      <span class="pill">${fmtDate(n.date)}</span>${n.brew?`<span class="pill">${esc(n.brew)}</span>`:''}
      <span class="stars grow" style="text-align:right">${'★'.repeat(n.rating||0)}${'☆'.repeat(5-(n.rating||0))}</span>
    </div>
    ${n.word?`<div class="expl" style="font-size:14.5px;line-height:1.9">「${esc(n.word)}」</div>`:''}
    ${n.flavorTags&&n.flavorTags.length?`<div class="figrid" style="margin-bottom:14px">${
      n.flavorTags.map(f=>`<span class="filab"><span class="fi">${ic(flavorIcon(f))}</span><span>${esc(f)}</span></span>`).join('')}</div>`:''}
    <div class="card">
      <div class="kv"><div class="k">香り</div><div class="v">${tagline(n.aroma)}${n.aromaNote?`<div class="sub" style="margin-top:5px">${esc(n.aromaNote)}</div>`:''}</div></div>
      <div class="kv"><div class="k">酸味</div><div class="v">${meter(n.acid)} <span class="sub">${esc(ACID_LEVEL[(n.acid||2)-1])}</span>${subTags(n.acidTags)}</div></div>
      <div class="kv"><div class="k">コク</div><div class="v">${meter(n.body)} <span class="sub">${esc(BODY_LEVEL[(n.body||2)-1])}</span>${subTags(n.bodyTags)}</div></div>
      ${n.food?`<div class="kv"><div class="k">フード</div><div class="v"><span class="fi" style="display:inline-flex;vertical-align:middle;margin-right:6px">${ic(foodIcon(n.food))}</span>${esc(n.food)}</div></div>`:''}
    </div>
    ${b?`<h2>公式のプロフィールと見くらべる</h2>
      <div class="card">
        <div class="kv"><div class="k">酸味</div><div class="v">${meter(b.acidity)}</div></div>
        <div class="kv"><div class="k">コク</div><div class="v">${meter(b.body)}</div></div>
        <div class="kv"><div class="k">風味</div><div class="v">${flavorRow(b, 6)}</div></div>
      </div>`:''}
    <button class="btn ghost" id="editNote" style="margin-top:14px">編集する</button>
  `);
  document.getElementById('editNote').onclick = ()=>openNoteForm(id);
}

/* =========================================================================
   クイズ
   ========================================================================= */
function beanQuestions(){
  const qs = [], beans = allBeans();
  const roastOpts = ['ブロンド ロースト','ミディアム ロースト','ダーク ロースト'];
  beans.forEach(b=>{
    if(!b.name) return;
    if(R[b.roast]) qs.push({c:'core', bean:b.id, q:`「${b.name}」の焙煎度は？`, o:roastOpts,
      a:roastOpts.indexOf(R[b.roast]+' ロースト'), e:`${b.name} は ${R[b.roast]} ロースト。${b.story||''}`});
    if(b.region) qs.push({c:'core', bean:b.id, q:`「${b.name}」の生産地は？`, o:REGIONS,
      a:Math.max(0,REGIONS.indexOf(b.region)), e:`${b.name} は ${b.origin||b.region}。`});
    if(PROCESSES.includes(b.process)) qs.push({c:'core', bean:b.id, q:`「${b.name}」の加工法は？`, o:PROCESSES,
      a:PROCESSES.indexOf(b.process), e:`${b.name} は ${b.process}。`});

    const others = beans.filter(x=>x.id!==b.id);
    const otherPairs = [...new Set(others.flatMap(x=>x.pairing||[]))].filter(p=>!(b.pairing||[]).includes(p));
    if((b.pairing||[]).length && otherPairs.length>=3){
      const correct = b.pairing[Math.floor(Math.random()*b.pairing.length)];
      const opts = shuffle([correct, ...shuffle(otherPairs).slice(0,3)]);
      qs.push({c:'core', bean:b.id, q:`「${b.name}」と相性がよいフードは？`, o:opts, a:opts.indexOf(correct),
        e:`${b.name}（${(b.flavors||[]).join('・')}）には ${b.pairing.join('、')}。似た風味どうしを合わせると、お互いが引き立つ。`});
    }
    const otherFlavors = [...new Set(others.flatMap(x=>x.flavors||[]))].filter(f=>!(b.flavors||[]).includes(f));
    if((b.flavors||[]).length && otherFlavors.length>=3){
      const correct = b.flavors[Math.floor(Math.random()*b.flavors.length)];
      const opts = shuffle([correct, ...shuffle(otherFlavors).slice(0,3)]);
      qs.push({c:'core', bean:b.id, q:`「${b.name}」の風味として正しいのは？`, o:opts, a:opts.indexOf(correct),
        e:`${b.name} の風味は ${b.flavors.join('・')}。`});
    }
    if(b.acidity && b.body){
      const lv = (x,y)=>`酸味 ${x} ／ コク ${y}`;
      const correct = lv(b.acidity,b.body);
      const opts = shuffle([correct, lv(b.acidity===3?1:b.acidity+1,b.body),
        lv(b.acidity,b.body===3?1:b.body+1), lv(b.acidity===1?3:b.acidity-1,b.body===1?3:b.body-1)]);
      qs.push({c:'core', bean:b.id, q:`「${b.name}」の酸味とコクは？（3段階）`, o:opts, a:opts.indexOf(correct),
        e:`${b.name} は 酸味${b.acidity}／コク${b.body}。深く煎るほど酸味は落ち、コクは増えるのが基本。`});
    }
  });
  ['blonde','medium','dark'].forEach(r=>{
    const same = beans.filter(b=>b.roast===r), other = beans.filter(b=>b.roast!==r);
    if(same.length && other.length>=3){
      const correct = same[Math.floor(Math.random()*same.length)];
      const opts = shuffle([correct.name, ...shuffle(other).slice(0,3).map(b=>b.name)]);
      qs.push({c:'core', q:`次のうち「${R[r]} ロースト」はどれ？`, o:opts, a:opts.indexOf(correct.name),
        e:`${correct.name} が ${R[r]} ロースト。`});
    }
  });
  return qs;
}

let quizSession = null;
function renderQuiz(){
  if(quizSession){ renderQuizStep(); return; }
  const stat = k => { const v=S.stats[k]; return v&&v.t ? `${Math.round(v.c/v.t*100)}%` : '—'; };
  const cats = Object.entries(CATS).filter(([k])=> k!=='mine' || S.customQuiz.length);
  view.innerHTML = `
    <div class="big" data-start="all">
      <span class="ic">${ic('quiz')}</span>
      <span class="grow"><span class="t" style="display:block">おまかせ 10問</span>
      <span class="d" style="display:block">ぜんぶの範囲から</span></span>
    </div>
    ${S.wrong.length ? `<div class="card tap" data-start="wrong"><div class="row">
        <span class="fi" style="width:38px;height:38px">${ic('pen')}</span>
        <div class="grow"><div style="font-size:14.5px;font-weight:700">まちがえた問題</div>
        <div class="sub">${S.wrong.length}問</div></div></div></div>` : ''}
    <h2>分野</h2>
    ${cats.map(([k,v])=>`
      <div class="card tap" data-start="${k}"><div class="row">
        <span class="fi" style="width:38px;height:38px">${ic(v.g)}</span>
        <div class="grow"><div style="font-size:14.5px;font-weight:700">${esc(v.nm)}</div></div>
        <span class="sub">${stat(k)}</span>
      </div></div>`).join('')}
    <button class="btn ghost" id="addQ" style="margin-top:12px">＋ 問題を作る</button>
    ${S.customQuiz.length?`<button class="btn ghost" id="mngQ" style="margin-top:8px">作った問題を見る（${S.customQuiz.length}）</button>`:''}
    ${totalQuiz().t ? `<button class="btn warn" id="resetStats" style="margin-top:8px">成績をリセット</button>` : ''}
  `;
  view.querySelectorAll('[data-start]').forEach(el=>el.onclick=()=>startQuiz(el.dataset.start));
  document.getElementById('addQ').onclick = ()=>openQuizForm();
  const mq = document.getElementById('mngQ'); if(mq) mq.onclick = ()=>openMyQuiz();
  const rs = document.getElementById('resetStats');
  if(rs) rs.onclick = ()=>{ if(confirm('成績とまちがえた問題を消します。記録・豆・ことばは残ります。')){ S.stats={}; S.beanStats={}; S.wrong=[]; if(save()) renderQuiz(); } };
}

function openQuizForm(){
  openSheet(`
    ${sheetHead('問題を作る')}
    <label class="fl">問題文</label>
    <textarea id="q_q" placeholder="例：エチオピアの加工法は？"></textarea>
    <label class="fl">正しい答え</label>
    <input type="text" id="q_a" placeholder="正解">
    <label class="fl">ちがう答え（3つ）</label>
    <input type="text" id="q_w1" placeholder="ちがう答え 1">
    <input type="text" id="q_w2" placeholder="ちがう答え 2" style="margin-top:8px">
    <input type="text" id="q_w3" placeholder="ちがう答え 3" style="margin-top:8px">
    <label class="fl">解説（覚え方）</label>
    <textarea id="q_e" placeholder="なぜそうなるのか、ひとこと"></textarea>
    <button class="btn" id="saveQ" style="margin-top:20px">保存する</button>
  `);
  document.getElementById('saveQ').onclick = ()=>{
    const q = document.getElementById('q_q').value.trim();
    const a = document.getElementById('q_a').value.trim();
    const w = ['q_w1','q_w2','q_w3'].map(i=>document.getElementById(i).value.trim()).filter(Boolean);
    if(!q || !a || w.length<3){ alert('問題文・正しい答え・ちがう答え3つを入れてください。'); return; }
    const opts = shuffle([a, ...w]);
    S.customQuiz.push({id:uid(), c:'mine', q, o:opts, a:opts.indexOf(a), e:document.getElementById('q_e').value.trim()||`答えは「${a}」。`});
    if(save()){ closeSheet(); renderQuiz(); }
  };
}
function openMyQuiz(){
  openSheet(`
    ${sheetHead('作った問題')}
    <div class="card">
      ${S.customQuiz.map(q=>`<div class="word"><div class="grow">
        <div class="w">${esc(q.q)}</div><div class="m">${esc(q.o[q.a])}</div></div>
        <button class="del" data-del="${q.id}">削除</button></div>`).join('') || '<p class="empty">まだありません。</p>'}
    </div>
  `);
  sheetBody.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{
    S.customQuiz = S.customQuiz.filter(x=>x.id!==el.dataset.del);
    if(save()){ openMyQuiz(); renderQuiz(); }
  });
}

function startQuiz(cat){
  const knowledge = QUIZ.concat(S.customQuiz);
  let pool;
  if(cat==='wrong'){
    const all = knowledge.concat(beanQuestions());
    pool = S.wrong.map(k=>all.find(q=>q.q===k)).filter(Boolean);
    if(!pool.length){ S.wrong=[]; save(); alert('復習する問題がありません。'); renderQuiz(); return; }
  }else if(cat==='core') pool = beanQuestions();
  else if(cat==='all') pool = knowledge.concat(beanQuestions());
  else pool = knowledge.filter(q=>q.c===cat);
  if(!pool.length){ alert('この分野の問題がまだありません。'); return; }
  quizSession = {cat, qs: shuffle(pool).slice(0,10), i:0, correct:0, results:[]};
  window.scrollTo(0,0); renderQuizStep();
}

function renderQuizStep(){
  const s = quizSession;
  if(s.i >= s.qs.length){ renderQuizResult(); return; }
  const q = s.qs[s.i];
  view.innerHTML = `
    <div class="qprog">${s.qs.map((_,i)=>`<i class="${i<s.i ? (s.results[i]?'on':'bad') : ''}"></i>`).join('')}</div>
    <p class="sub" style="margin-bottom:6px">${s.i+1} / ${s.qs.length}　${esc((CATS[q.c]||{}).nm||'')}</p>
    <p class="qtext">${esc(q.q)}</p>
    <div id="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
    <div id="after"></div>`;
  view.querySelectorAll('.opt').forEach(el=>el.onclick=()=>answer(+el.dataset.i));
}

function answer(pick){
  const s = quizSession, q = s.qs[s.i], ok = pick===q.a;
  s.results[s.i] = ok; if(ok) s.correct++;
  S.stats[q.c] = S.stats[q.c] || {c:0,t:0}; S.stats[q.c].t++; if(ok) S.stats[q.c].c++;
  if(q.bean){ S.beanStats[q.bean] = S.beanStats[q.bean] || {c:0,t:0}; S.beanStats[q.bean].t++; if(ok) S.beanStats[q.bean].c++; }
  if(ok) S.wrong = S.wrong.filter(x=>x!==q.q);
  else if(!S.wrong.includes(q.q)) S.wrong.push(q.q);
  save();
  view.querySelectorAll('.opt').forEach((el,i)=>{
    el.disabled = true;
    if(i===q.a) el.classList.add(ok?'correct':'reveal');
    else if(i===pick) el.classList.add('wrong');
  });
  document.getElementById('after').innerHTML = `
    <div class="expl" style="margin-top:14px"><b>${ok?'正解':'おしい'}</b>　${esc(q.e)}</div>
    <button class="btn" id="nextQ">${s.i+1>=s.qs.length?'結果を見る':'次へ'}</button>`;
  document.getElementById('nextQ').onclick = ()=>{ s.i++; window.scrollTo(0,0); renderQuizStep(); };
}

function renderQuizResult(){
  const s = quizSession, pct = Math.round(s.correct/s.qs.length*100);
  view.innerHTML = `
    <div class="score"><b>${s.correct}<span style="font-size:20px;color:var(--muted)"> / ${s.qs.length}</span></b>
      <span>${pct}％</span></div>
    <div style="margin-top:18px">
      ${s.qs.map((q,i)=>`<div class="card" style="padding:13px 15px"><div class="row" style="align-items:flex-start">
        <span style="flex-shrink:0;width:18px;font-weight:700">${s.results[i]?'○':'×'}</span>
        <span class="grow">
          <span style="display:block;font-size:13.5px;font-weight:700;line-height:1.6">${esc(q.q)}</span>
          <span style="display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.7">${esc(q.o[q.a])}　—　${esc(q.e)}</span>
        </span></div></div>`).join('')}
    </div>
    <button class="btn" id="again" style="margin-top:14px">もう10問</button>
    <button class="btn ghost" id="backQ" style="margin-top:8px">分野をえらぶ</button>`;
  quizSession = null;
  document.getElementById('again').onclick = ()=>startQuiz(s.cat);
  document.getElementById('backQ').onclick = ()=>renderQuiz();
}

/* =========================================================================
   ことば
   ========================================================================= */
let wordCat = 'すべて', wordQuery = '';
function renderWords(){
  const words = allWords();
  const cats = ['すべて', ...new Set(words.map(w=>w.c))];
  const list = words.filter(w=>
    (wordCat==='すべて' || w.c===wordCat) &&
    (!wordQuery || w.w.includes(wordQuery) || w.m.includes(wordQuery)));
  view.innerHTML = `
    <input type="search" id="wq" placeholder="ことばを探す" value="${esc(wordQuery)}" style="margin-bottom:12px">
    <div class="filters">${cats.map(c=>`<button class="chip ${wordCat===c?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="card">
      ${list.length ? list.map(w=>`<div class="word"><div class="grow">
        <div class="w">${esc(w.w)}</div><div class="m">${esc(w.m)}</div></div>
        ${w.id?`<button class="del" data-del="${w.id}">削除</button>`:''}</div>`).join('')
        : '<p class="empty">見つかりませんでした。</p>'}
    </div>
    <button class="btn ghost" id="addWord" style="margin-top:14px">＋ ことばを追加する</button>`;
  const wq = document.getElementById('wq');
  wq.oninput = e=>{ wordQuery=e.target.value.trim(); const p=window.scrollY; renderWords(); window.scrollTo(0,p); document.getElementById('wq').focus(); };
  view.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{ wordCat=el.dataset.c; renderWords(); });
  view.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{
    S.customWords = S.customWords.filter(x=>x.id!==el.dataset.del); if(save()) renderWords();
  });
  document.getElementById('addWord').onclick = ()=>openWordForm();
}
function openWordForm(){
  const cats = [...new Set(WORDS.map(w=>w.c))];
  openSheet(`
    ${sheetHead('ことばを追加する')}
    <label class="fl">分類</label>
    <select id="w_c">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
    <label class="fl">ことば</label>
    <input type="text" id="w_w" placeholder="例：カッピング">
    <label class="fl">意味</label>
    <textarea id="w_m" placeholder="どういう意味か、ひとことで"></textarea>
    <button class="btn" id="saveWord" style="margin-top:20px">保存する</button>`);
  document.getElementById('saveWord').onclick = ()=>{
    const w = document.getElementById('w_w').value.trim(), m = document.getElementById('w_m').value.trim();
    if(!w || !m){ alert('ことばと意味を入れてください。'); return; }
    S.customWords.push({id:uid(), c:document.getElementById('w_c').value, w, m});
    if(save()){ closeSheet(); renderWords(); }
  };
}

document.getElementById('gearBtn').onclick = ()=>{
  const photoCount = Object.keys(S.photos).length + S.notes.filter(n=>n.photo).length;
  openSheet(`
    ${sheetHead('このアプリについて')}
    <a class="btn ghost" href="black-apron-tsukaikata.html" style="text-decoration:none; margin-bottom:14px">使い方を見る</a>
    <p class="sub" style="line-height:1.9">記録・写真・メモ・成績は、この端末のブラウザの中だけに保存されます（どこにも送られません）。
    機種変更のときや、消えると困るときは書き出してください。</p>
    <div class="card" style="margin-top:14px">
      <div class="kv"><div class="k">記録</div><div class="v">${S.notes.length} 件</div></div>
      <div class="kv"><div class="k">豆</div><div class="v">${allBeans().length} 種類（自分で追加 ${S.customBeans.length}）</div></div>
      <div class="kv"><div class="k">写真</div><div class="v">${photoCount} 枚</div></div>
      <div class="kv"><div class="k">解いた問題</div><div class="v">${totalQuiz().t} 問</div></div>
    </div>
    <h2>パッケージの写真</h2>

    写真はこのアプリには保存せず、<b>公式のサーバーから直接読み込んでいます</b>。
    1枚およそ190KBあるので、通信が気になるときや、公式サイトの更新で出なくなったときはここで消せます。</p>
    <button class="btn ghost" id="pkgBtn">${S.officialImg===false?'公式のパッケージ写真を出す':'公式のパッケージ写真を消す'}</button>
    <p class="sub" style="margin-top:8px">季節限定の6種は公式サイトに画像が置かれていないため出ません。
    自分で撮った写真を入れると、そちらが優先されます。</p>

    <h2>データ</h2>
    <button class="btn ghost" id="expBtn" style="margin-top:0">データを書き出す</button>
    <button class="btn ghost" id="impBtn" style="margin-top:8px">データを読み込む</button>
    <input type="file" id="impFile" accept="application/json,.json" style="display:none">
    <h2>ホーム画面に置くと使いやすい</h2>
    <p class="sub">iPhone は Safari の共有ボタン →「ホーム画面に追加」。アプリのように開けます。</p>

    <p class="sub" style="line-height:1.9">スターバックス コーヒー ジャパンの公式サイト（コーヒー豆・テイスティング・いれ方の4つの基本・用語集・フードペアリング）と、
    ブラックエプロン受験者による公開記事をもとに整理しました。試験の内容は年によって変わります。社内の最新資料を必ず優先してください。</p>`);
  document.getElementById('pkgBtn').onclick = ()=>{
    S.officialImg = (S.officialImg === false);
    if(save()){ closeSheet(); render(); }
  };
  document.getElementById('expBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(S)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `black-apron-note-${todayStr()}.json`;

  if(tab!=='home') return;
  if(Math.abs(window.innerHeight - lastH) < 40) return;
  lastH = window.innerHeight; render();
});
