<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>にいがた旅しおり</title>
<meta name="description" content="新潟の旅の行き先と乗り継ぎを、地図から組み立てるしおり。">
<meta name="theme-color" content="#F6F3ED">
<link rel="apple-touch-icon" href="icon-niigata-tabi.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="にいがた旅">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F3ED; --surface:#EFEBE3; --ink:#23211E; --muted:#7C766C;
  --hair:#DDD8CF; --ghost:#B9B3A8; --control:#FBFAF7;
  --sea:#CBDEE6; --sea-deep:#B4CCD6; --land:#F4EFE2; --land-line:#B9AE96;
  --hl:#C97B4E; --hl-soft:#F0D9C8;
  --ok:#5F8A61; --warn:#C99A3E; --gray:#B0AAA0;
  --sh:0 2px 10px rgba(35,33,30,.06);
  --sh-up:0 -6px 26px rgba(35,33,30,.13);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow:hidden;}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  line-height:1.7; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  overscroll-behavior:none; touch-action:none;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
.hide{display:none !important;}

/* ===== 画面の土台 ===== */
.screen{position:fixed; inset:0; display:flex; flex-direction:column;
  transition:opacity .45s ease, transform .45s ease;}
.screen.out{opacity:0; pointer-events:none; transform:scale(1.06);}

/* ===== 1. 日本列島 ===== */
#s-japan{background:var(--sea); z-index:10;}
#s-japan .top{position:absolute; top:0; left:0; right:0; z-index:3;
  padding:calc(env(safe-area-inset-top) + 26px) 24px 0; text-align:center; pointer-events:none;}
#s-japan .kicker{font-size:11px; font-weight:700; letter-spacing:.2em; color:#6E8994;}
#s-japan h1{font-size:23px; font-weight:700; letter-spacing:.05em; margin-top:8px;}
#s-japan .sub{font-size:12.5px; color:#6E8994; margin-top:6px;}
#s-japan .hint{position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 30px);
  text-align:center; font-size:13px; color:#5E7A86; z-index:3; pointer-events:none;}
#s-japan .hint b{display:block; font-size:14.5px; color:var(--hl); margin-bottom:4px;}
#s-japan .hint .pinch{display:inline-block; animation:breathe 2.4s ease-in-out infinite; font-size:22px;}
@keyframes breathe{0%,100%{transform:scale(1); opacity:.85} 50%{transform:scale(1.16); opacity:1}}
.mapwrap{flex:1; position:relative; overflow:hidden; touch-action:none;}
.mapwrap svg{position:absolute; inset:0; width:100%; height:100%; display:block;}
#jp-g,#ng-g{transform-box:view-box; transform-origin:0 0; will-change:transform;}

.land{fill:var(--land); stroke:var(--land-line); stroke-width:1.4; stroke-linejoin:round;}
.land-dim{fill:#DCD5C4; stroke:#C7BEA9; stroke-width:.8;}
.pref-hl{fill:var(--hl); stroke:var(--hl); stroke-width:3; stroke-linejoin:round; stroke-linecap:round;}
.pulse{fill:none; stroke:var(--hl); stroke-width:2; opacity:0; transform-origin:center;}
@keyframes ping{0%{opacity:.7; r:6} 70%{opacity:0; r:34} 100%{opacity:0; r:34}}
.mapwrap .lbl{font-size:13px; font-weight:700; fill:var(--hl); paint-order:stroke;
  stroke:var(--paper); stroke-width:3.5px; stroke-linejoin:round;}

/* ===== 2. 新潟マップ ===== */
#s-map{background:var(--sea); z-index:5;}
.bar{position:relative; z-index:4; background:rgba(246,243,237,.94); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--hair); padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;}
.bar-row{display:flex; align-items:center; gap:8px;}
.daytabs{display:flex; background:var(--surface); border-radius:12px; padding:3px; gap:3px; flex:1;}
.daytab{flex:1; padding:7px 4px; border-radius:9px; font-size:12.5px; font-weight:700;
  color:var(--muted); text-align:center; line-height:1.35; transition:.15s;}
.daytab .dd{display:block; font-size:11.5px; font-weight:500; opacity:.8;}
.daytab.on{background:var(--control); color:var(--ink); box-shadow:var(--sh);}
.iconbtn{width:38px; height:38px; border-radius:11px; background:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;}
.iconbtn:active{transform:scale(.94);}
.fromchip{margin-top:9px; display:flex; align-items:center; gap:7px; background:var(--control);
  border:1px solid var(--hair); border-radius:12px; padding:8px 11px; font-size:12.5px;}
.fromchip .k{font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:.06em;
  background:var(--surface); padding:2px 7px; border-radius:6px; flex-shrink:0;}
.fromchip .v{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.fromchip .n{margin-left:auto; font-size:11px; color:var(--muted); flex-shrink:0;}

.zoomhint{position:absolute; left:50%; transform:translateX(-50%); bottom:16px; z-index:3;
  background:rgba(35,33,30,.78); color:#fff; font-size:11.5px; padding:6px 14px; border-radius:20px;
  pointer-events:none; transition:opacity .3s;}

/* ピン */
.pin{cursor:pointer;}
.pin .ring{fill:var(--control); stroke-width:2.4;}
.pin .em{font-size:18px; text-anchor:middle; dominant-baseline:central;}
.pin .nm{font-size:11px; font-weight:700; text-anchor:middle; fill:var(--ink);
  paint-order:stroke; stroke:var(--paper); stroke-width:3px; stroke-linejoin:round;}
.pin.picked .ring{fill:var(--hl); stroke:var(--hl);}
.pin.shut{opacity:.42;}
.pin .num{font-size:12px; font-weight:700; text-anchor:middle; dominant-baseline:central; fill:#fff;}
.cluster .cring{fill:var(--control); stroke:var(--hl); stroke-width:2.2;}
.cluster .cn{font-size:15px; font-weight:700; text-anchor:middle; dominant-baseline:central; fill:var(--hl);}
.cluster .cl{font-size:11px; font-weight:700; text-anchor:middle; fill:var(--ink);
  paint-order:stroke; stroke:var(--paper); stroke-width:3px;}
.trail{fill:none; stroke:var(--hl); stroke-width:2.2; stroke-dasharray:5 5; opacity:.75; stroke-linecap:round;}

/* ===== ボトムシート ===== */
.veil{position:fixed; inset:0; background:rgba(35,33,30,.34); z-index:40; opacity:0;
  pointer-events:none; transition:opacity .28s;}
.veil.on{opacity:1; pointer-events:auto;}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--paper);
  border-radius:26px 26px 0 0; box-shadow:var(--sh-up); transform:translateY(101%);
  transition:transform .34s cubic-bezier(.32,.72,.32,1); max-height:88vh; display:flex; flex-direction:column;}
.sheet.on{transform:translateY(0);}
/* ⚠️ 以前はここに横棒（グリップ）を置いていたが、引っぱって閉じる操作は付いていない
   （閉じるのは背景タップだけ）。効かない印は「押しても動かないボタン」に見える。
   → 横棒はやめて、実際に閉じられる ✕ を置く（2026-08-31）。 */
.sheet-x{position:absolute; top:10px; right:14px; z-index:2; width:44px; height:44px;
  border:none; background:none; color:var(--muted); font:inherit; font-size:17px;
  line-height:1; cursor:pointer; border-radius:12px; flex-shrink:0;}
.sheet-x:active{transform:scale(.94);}
.sheet-scroll{overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y;
  /* 上は ✕（44px＋上10px）に重ならない高さを空ける */
  padding:16px 22px calc(env(safe-area-inset-bottom) + 22px);}

.sp-head{display:flex; gap:13px; align-items:flex-start; padding-top:6px; padding-right:40px;}
.sp-em{width:52px; height:52px; border-radius:16px; background:var(--surface); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:26px;}
.sp-t h2{font-size:19px; font-weight:700; line-height:1.4;}
.sp-t .tag{font-size:12.5px; color:var(--hl); font-weight:700; margin-top:2px;}
.badges{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
.badge{font-size:11px; font-weight:700; padding:4px 10px; border-radius:8px;
  background:var(--surface); color:var(--muted);}
.badge.g{background:#E7F0E7; color:#4A7A4C;}
.badge.y{background:#F7EDD6; color:#8C6A21;}
.badge.w{background:#EDEAE4; color:#7A746A;}
.badge.x{background:#F6DEDA; color:#A24B3C;}
.why{font-size:13.5px; line-height:1.85; margin-top:14px; color:#3A3733;}
.facts{margin-top:14px; border:1px solid var(--hair); border-radius:14px; overflow:hidden;}
.fact{display:flex; gap:10px; padding:9px 13px; font-size:12.5px; border-bottom:1px solid var(--hair);}
.fact:last-child{border-bottom:none;}
.fact .fk{width:66px; flex-shrink:0; color:var(--muted); font-weight:700; font-size:11.5px;}
.fact .fv{flex:1;}
.note{margin-top:12px; background:#F7EFE3; border-left:3px solid var(--warn);
  border-radius:0 10px 10px 0; padding:10px 13px; font-size:12.5px; line-height:1.75; color:#6B5730;}
.note.bad{background:#F9E7E3; border-color:#C4664F; color:#7A3B2D;}

.btn{display:block; width:100%; padding:15px; border-radius:15px; font-size:15px; font-weight:700;
  text-align:center; margin-top:14px; transition:transform .12s;}
.btn:active{transform:scale(.98);}
.btn.p{background:var(--hl); color:#fff;}
.btn.s{background:var(--surface); color:var(--ink); border:1px solid var(--hair);}
.btn.d{background:none; color:#A24B3C; border:1px solid #E4C8C2; font-size:13.5px; padding:12px;}
.btn[disabled]{opacity:.45; pointer-events:none;}
.btnrow{display:flex; gap:9px;}
.btnrow .btn{flex:1;}

/* ルート比較 */
.rt-head{padding-top:6px; padding-right:40px;}  /* 右上の ✕ に潜り込ませない */
.rt-head .ab{display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:700; flex-wrap:wrap;}
.rt-head .ab .ar{color:var(--ghost);}
.rt-head .sm{font-size:11.5px; color:var(--muted); font-weight:500; margin-top:4px;}
.opt{border:1.5px solid var(--hair); border-radius:16px; padding:13px 15px; margin-top:11px; background:var(--control);}
.opt.best{border-color:var(--hl); background:#FDF7F2;}
.opt-top{display:flex; align-items:center; gap:9px;}
.opt-ic{width:32px; height:32px; border-radius:10px; background:var(--surface); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:16px;}
.opt-nm{font-size:13.5px; font-weight:700; flex:1;}
.opt-crown{font-size:10px; font-weight:700; color:#fff; background:var(--hl);
  padding:2px 8px; border-radius:7px; flex-shrink:0;}
.opt-num{display:flex; gap:16px; margin-top:9px; align-items:baseline;}
.opt-num .n{font-size:21px; font-weight:700; line-height:1;}
.opt-num .n small{font-size:12px; font-weight:500; margin-left:2px; color:var(--muted);}
.opt-num .u{font-size:11px; color:var(--muted); font-weight:700; display:block; margin-bottom:3px;}
.opt-det{font-size:12px; color:var(--muted); margin-top:9px; line-height:1.7;}
.leg{display:flex; gap:8px; font-size:12px; margin-top:7px; align-items:flex-start;}
.leg .li{flex-shrink:0; width:16px; text-align:center;}
.opt-warn{font-size:11.5px; color:#8C6A21; background:#F7EFE3; border-radius:8px;
  padding:7px 10px; margin-top:9px; line-height:1.65;}
.times{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px;}
.times .tm{font-size:11.5px; font-weight:700; background:var(--surface); color:var(--ink);
  padding:3px 9px; border-radius:7px;}
.estnote{font-size:11px; color:var(--ghost); margin-top:14px; line-height:1.7;}

/* ===== 3. しおり ===== */
#s-plan{background:var(--paper); z-index:8;}
.plan-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y;
  padding:16px 20px calc(env(safe-area-inset-bottom) + 96px);}
.sum{display:flex; gap:9px; margin-bottom:16px;}
.sumcard{flex:1; background:var(--control); border:1px solid var(--hair); border-radius:15px;
  padding:12px 13px; text-align:center;}
.sumcard .k{font-size:11.5px; color:var(--muted); font-weight:700;}
.sumcard .v{font-size:19px; font-weight:700; margin-top:3px; line-height:1.2;}
.sumcard .v small{font-size:11px; font-weight:500; color:var(--muted); margin-left:1px;}

.tl{position:relative; padding-left:34px;}
.tl:before{content:''; position:absolute; left:12px; top:14px; bottom:14px; width:2px;
  background:var(--hair); border-radius:1px;}
.node{position:relative; margin-bottom:6px;}
.node .dot{position:absolute; left:-34px; top:12px; width:26px; height:26px; border-radius:50%;
  background:var(--hl); color:#fff; font-size:11.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 4px var(--paper);}
.node .dot.st{background:var(--ink);}
.node .card{background:var(--control); border:1px solid var(--hair); border-radius:15px;
  padding:13px 15px; display:flex; gap:11px; align-items:center;}
.node .card .e{font-size:22px; flex-shrink:0;}
.node .card .nm{font-size:14.5px; font-weight:700; line-height:1.4;}
.node .card .sm{font-size:11.5px; color:var(--muted); margin-top:1px;}
.node .card .x{margin-left:auto; font-size:16px; color:var(--ghost); padding:10px 8px; flex-shrink:0;}
.hop{padding:9px 0 9px 2px; font-size:12px; color:var(--muted); line-height:1.7;}
.hop b{color:var(--ink); font-weight:700;}
.hop .m{display:inline-block; margin-right:5px;}
.hop .alt{display:block; font-size:11px; color:var(--ghost); margin-top:2px;}
.empty{text-align:center; padding:44px 20px; color:var(--muted);}
.empty .e{font-size:38px; display:block; margin-bottom:12px; opacity:.6;}
.empty p{font-size:13.5px; line-height:1.9;}

.fab{position:fixed; left:20px; right:20px; bottom:calc(env(safe-area-inset-bottom) + 74px); z-index:20;}
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex;
  background:rgba(246,243,237,.95); backdrop-filter:blur(12px); border-top:1px solid var(--hair);
  padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1; padding:9px 0 8px; text-align:center; color:var(--ghost); font-size:10.5px; font-weight:700;}
.tab .ti{display:block; font-size:19px; line-height:1.25;}
.tab.on{color:var(--hl);}
</style>
</head>
<body>

<!-- ===== 1. 日本列島 ===== -->
<section class="screen" id="s-japan">
  <div class="top">
    <p class="kicker">NIIGATA 2026.08.24 - 25</p>
    <h1>にいがた旅しおり</h1>
    <p class="sub">ふたりの1泊2日を、地図から組み立てる</p>
  </div>
  <div class="mapwrap" id="jp-wrap">
    <svg id="jp-svg" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid meet">
      <g id="jp-g"></g>
    </svg>
  </div>
  <div class="hint">
    <b>新潟を、ふたつの指で広げて</b>
    <span class="pinch">🤏</span>
    <div style="font-size:11.5px;margin-top:2px;opacity:.8">タップでも進めます</div>
  </div>
</section>

<!-- ===== 2. 新潟マップ ===== -->
<section class="screen out" id="s-map">
  <div class="bar">
    <div class="bar-row">
      <button class="iconbtn" id="btn-back" aria-label="日本地図へ戻る">‹</button>
      <div class="daytabs" id="daytabs"></div>
      <button class="iconbtn" id="btn-fit" aria-label="全体表示">⊙</button>
    </div>
    <div class="fromchip">
      <span class="k">いまここ</span>
      <span class="v" id="from-name">新潟駅</span>
      <span class="n" id="from-n"></span>
    </div>
  </div>
  <div class="mapwrap" id="ng-wrap">
    <svg id="ng-svg" viewBox="0 0 400 620" preserveAspectRatio="xMidYMid meet">
      <g id="ng-g"></g>
    </svg>
    <div class="zoomhint" id="zoomhint">つまんで広げると、新潟市の中が開きます</div>
  </div>
</section>

<!-- ===== 3. しおり ===== -->
<section class="screen out" id="s-plan">
  <div class="bar">
    <div class="bar-row">
      <div class="daytabs" id="daytabs2"></div>
      <button class="iconbtn" id="btn-share" aria-label="しおりを共有">↗</button>
    </div>
  </div>
  <div class="plan-scroll" id="plan-body"></div>
  <div class="fab"><button class="btn p" id="btn-add">＋ つぎの行き先を地図から選ぶ</button></div>
</section>

<!-- ===== タブ ===== -->
<nav class="tabbar hide" id="tabbar">
  <button class="tab on" data-go="map"><span class="ti">🗺</span>地図</button>
  <button class="tab" data-go="plan"><span class="ti">📖</span>しおり</button>
</nav>

<!-- ===== シート ===== -->
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"><button class="sheet-x" onclick="closeSheets()" aria-label="とじる">✕</button><div class="sheet-scroll" id="sheet-body"></div></div>
<div class="sheet" id="rsheet"><button class="sheet-x" onclick="closeSheets()" aria-label="とじる">✕</button><div class="sheet-scroll" id="rsheet-body"></div></div>

<script>

/* ============================================================
   地図を描く
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const NS='http://www.w3.org/2000/svg';
const el=(t,a={})=>{const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e;};

// 経度緯度 → 画面座標
function mkProj(lon0,lon1,lat0,lat1,w,h){
  const cs=Math.cos((lat0+lat1)/2*Math.PI/180);   // 緯度が上がるほど経度1度は短くなる
  const W=(lon1-lon0)*cs, H=(lat1-lat0);
  const s=Math.min(w/W,h/H), ox=(w-W*s)/2, oy=(h-H*s)/2;
  return (lon,lat)=>[ox+(lon-lon0)*cs*s, oy+(lat1-lat)*s];
}
function toPath(pts,p,close){
  let d=pts.map((c,i)=>(i?'L':'M')+p(c[0],c[1]).map(n=>n.toFixed(1)).join(' ')).join(' ');
  return close===false?d:d+' Z';
}

const JP_P=mkProj(128.5,146.5,30.3,45.9,400,520);
const JP_VB=[400,520], NG_VB=[400,620];
const NG_P=mkProj(137.62,140.0,36.66,38.72,400,620);

/* ============================================================
   つまんで動かす（パン・ピンチズーム）
   ============================================================ */
function makePanZoom(wrapSel,gSel,vb,opt){
  const wrap=$(wrapSel), g=$(gSel), svg=wrap.querySelector('svg');
  const [VBW,VBH]=vb;
  const st={x:0,y:0,k:1};
  const cfg=Object.assign({min:.5,max:60,onChange:null,onEnd:null,onZoomPast:null,past:1e9,home:null},opt||{});
  let pts=new Map(), st0=null, d0=0, c0=null, moved=false, fired=false;

  // 画面の座標を、地図の中の座標に直す（SVGの拡大縮小をそのまま反映）
  function toUser(cx,cy){
    const m=svg.getScreenCTM(); if(!m) return [0,0];
    const p=svg.createSVGPoint(); p.x=cx; p.y=cy;
    const q=p.matrixTransform(m.inverse()); return [q.x,q.y];
  }
  let tid=null;
  function apply(){
    g.style.transform=`translate(${st.x.toFixed(2)}px, ${st.y.toFixed(2)}px) scale(${st.k.toFixed(4)})`;
    cfg.onChange&&cfg.onChange(st);
  }
  const noAnim=()=>{ g.style.transition='none'; if(tid){clearTimeout(tid); tid=null;} };
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

  wrap.addEventListener('pointerdown',e=>{
    noAnim(); wrap.setPointerCapture(e.pointerId); pts.set(e.pointerId,toUser(e.clientX,e.clientY)); moved=false;
    if(pts.size===2){ const [a,b]=[...pts.values()]; d0=dist(a,b); c0=mid(a,b); st0={...st}; }
  });
  wrap.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return;
    const prev=pts.get(e.pointerId), now=toUser(e.clientX,e.clientY);
    if(dist(now,prev)>1.5) moved=true;
    if(pts.size===2 && st0){
      pts.set(e.pointerId,now);
      const [a,b]=[...pts.values()], d=dist(a,b), c=mid(a,b);
      const k=Math.min(cfg.max,Math.max(cfg.min, st0.k*(d/(d0||1))));
      st.k=k; st.x=c[0]-(c0[0]-st0.x)*(k/st0.k); st.y=c[1]-(c0[1]-st0.y)*(k/st0.k);
      apply();
      if(!fired && cfg.onZoomPast && k>=cfg.past){ fired=true; cfg.onZoomPast(); }
    }else if(pts.size===1){
      st.x+=now[0]-prev[0]; st.y+=now[1]-prev[1]; apply();
      pts.set(e.pointerId,toUser(e.clientX,e.clientY));
    }
  });
  const up=e=>{ pts.delete(e.pointerId); if(pts.size<2) st0=null;
    if(pts.size===0 && moved) cfg.onEnd&&cfg.onEnd(); };
  wrap.addEventListener('pointerup',up); wrap.addEventListener('pointercancel',up);

  const api={
    st, apply, wrap, g, vb,
    get moved(){ return moved; },
    // 指定した点の集まりが画面いっぱいに入る倍率と中心を出す
    fit(points,frac){
      const xs=points.map(p=>p[0]), ys=points.map(p=>p[1]);
      const span=Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys));
      const pad=Math.max(span*(frac==null?.2:frac), 2);
      const x0=Math.min(...xs)-pad, x1=Math.max(...xs)+pad;
      const y0=Math.min(...ys)-pad, y1=Math.max(...ys)+pad;
      const k=Math.min(cfg.max, Math.max(cfg.min, Math.min(VBW/(x1-x0), VBH/(y1-y0))));
      return {k, cx:(x0+x1)/2, cy:(y0+y1)/2};
    },
    set(v,animate,ms){
      ms=ms||620;
      const to={k:v.k, x:VBW/2-v.cx*v.k, y:VBH/2-v.cy*v.k};
      noAnim();
      st.k=to.k; st.x=to.x; st.y=to.y;
      if(animate) g.style.transition=`transform ${ms}ms cubic-bezier(.32,.72,.32,1)`;
      apply();
      if(animate) tid=setTimeout(()=>{ g.style.transition='none'; tid=null; cfg.onEnd&&cfg.onEnd(); }, ms+40);
    },
    reset(animate){ fired=false; if(cfg.home) api.set(cfg.home(),animate); else { noAnim(); st.x=0;st.y=0;st.k=1;apply(); } },
    zoomTo(px,py,k,ms){ api.set({k,cx:px,cy:py},true,ms); }
  };
  return api;
}

const KEY='niigata-tabi-v1';
const byId=Object.fromEntries(SPOTS.map(s=>[s.id,s]));
let state={day:'d1', plan:{d1:[], d2:[]}};
try{ const r=localStorage.getItem(KEY); if(r){ const o=JSON.parse(r); if(o&&o.plan) state=Object.assign(state,o); } }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} };

const dayOf=id=>DAYS.find(d=>d.id===id);
function startOf(d){ if(d==='d1') return HUB; const p=state.plan.d1; return p.length?p[p.length-1]:HUB; }
function baseOf(d){ const p=state.plan[d]; return p.length?p[p.length-1]:startOf(d); }
function isShut(sp,dayId){ return (sp.shut||[]).includes(dayOf(dayId).wd); }

/* ============================================================
   行き方を求める
   ============================================================ */
function metersBetween(a,b){
  const R=6371000, r=Math.PI/180;
  const dLa=(b.lat-a.lat)*r, dLo=(b.lon-a.lon)*r, la=(a.lat+b.lat)/2*r;
  return Math.round(Math.hypot(dLa, dLo*Math.cos(la))*R);
}
function walkOpt(a,b){
  const m=metersBetween(a,b), min=Math.max(3,Math.round(m*1.3/80));
  return {mode:'walk',label:'歩く',min,yen:0,est:true,
    detail:`直線でおよそ${(m/1000).toFixed(1)}km。実際の道のりは多少前後します`};
}
const MODE_ICON={walk:'🚶',bus:'🚌',train:'🚃',mix:'🚃',taxi:'🚕',shin:'🚄'};

// A地点 → B地点 の行き方の候補を返す
function routesBetween(fromId,toId){
  const A=byId[fromId], B=byId[toId];
  if(!A||!B||A.id===B.id) return [];
  // ぽんしゅ館は新潟駅の構内なので、駅とみなす
  const hubLike=id=>id===HUB||id==='ponshukan';
  const revLabel=l=>l.replace('新潟駅から','').replace('新潟駅','')+'（戻り）';
  // 新潟駅 → どこか
  if(hubLike(A.id) && (B.routes||[]).length) return B.routes.map(r=>({...r,legs:null}));
  // どこか → 新潟駅（同じ道を戻る）
  if(hubLike(B.id) && (A.routes||[]).length) return A.routes.map(r=>({...r,
    detail:r.detail, times:r.back||null, back:null, legs:null,
    label:revLabel(r.label)}));
  // 新潟市の中どうし → 歩き（遠ければバスも）
  if(A.area==='city' && B.area==='city'){
    const w=walkOpt(A,B), out=[w];
    if(w.min>22) out.push({mode:'bus',label:'観光循環バス',min:Math.round(w.min*0.55)+6,yen:260,est:true,
      detail:'新潟駅を発着する循環バス。1日乗車券500円なら乗り降り自由です'});
    return out;
  }
  // それ以外 → 新潟駅で乗り継ぐ
  const legA=bestRoute(A.id,HUB);
  const legB=(B.routes||[]);
  if(!legA||!legB.length) return [];
  return legB.map(b=>({
    mode:'mix', label:`新潟駅で乗り継ぎ・${b.label}`,
    min:legA.min+b.min+12, yen:(legA.yen||0)+(b.yen||0),
    est:legA.est||b.est, warn:b.warn, times:b.times,
    legs:[{i:MODE_ICON[legA.mode]||'🚃',t:`${A.name} → 新潟駅`,s:`${legA.label} ${legA.min}分 / ${legA.yen?legA.yen.toLocaleString()+'円':'0円'}`},
          {i:'⏱',t:'新潟駅での乗り継ぎ',s:'12分ほどみています'},
          {i:MODE_ICON[b.mode]||'🚃',t:`新潟駅 → ${B.name}`,s:`${b.label} ${b.min}分 / ${b.yen?b.yen.toLocaleString()+'円':'0円'}`}],
    detail:b.detail
  }));
}
// しおりの合計に使う一本を選ぶ。ほかに手があるならタクシー系は選ばない
function bestRoute(f,t){
  let r=routesBetween(f,t); if(!r.length) return null;
  const noTaxi=r.filter(o=>o.mode!=='taxi' && !/タクシー/.test(o.label));
  if(noTaxi.length) r=noTaxi;
  return r.slice().sort((a,b)=>a.min-b.min)[0];
}

/* ============================================================
   新潟マップを描く
   ============================================================ */
const CAT_COLOR={'神社':'#C0654A','温泉':'#D08A3E','海鮮':'#4E7E92','アート':'#7C6A9C',
  '歴史':'#8A7A55','自然':'#5F8A61','酒':'#A8894E','まち':'#9A7A6A','起点':'#23211E'};
const SIG_COLOR={green:'#5F8A61',yellow:'#C99A3E',white:'#B0AAA0'};

// 地図の上では長い名前は入りきらないので、短い呼び名を使う
const SHORT={'niigata-sta':'新潟駅','ponshukan':'ぽんしゅ館','pia':'ピアBandai','imayotsukasa':'今代司酒造',
 'nuttari':'沼垂テラス','hakusan':'白山神社','banbi':'万代島美術館','minatopia':'みなとぴあ',
 'saitoke':'旧齋藤家別邸','sakyukan':'砂丘館','marinepia':'マリンピア','hiyoriyama':'日和山',
 'yahiko':'彌彦神社','yahiko-rw':'弥彦山ロープウェイ','tsukioka':'月岡温泉','hoppou':'北方文化博物館',
 'murakami':'村上','iwamuro':'岩室温泉'};
// 名前どうしがぶつからないよう、上に出すか下に出すかを決めておく
const LDY={'tsukioka':-30,'hoppou':36,'murakami':36,'yahiko-rw':36,'iwamuro':-30,'hiyoriyama':-30,
 'saitoke':-30,'banbi':-30,'imayotsukasa':36,'pia':-30};

// 近すぎる場所は「束」にまとめて、つまんで広げると開く
const AREAS={city:{name:'新潟市中心部',ldy:-34},yahiko:{name:'弥彦・岩室',ldy:38}};
const areaSpots=a=>SPOTS.filter(s=>s.area===a);
function centroid(list){
  return [list.reduce((t,s)=>t+s.lon,0)/list.length, list.reduce((t,s)=>t+s.lat,0)/list.length];
}

let ngPZ=null, openAreas=new Set(), CLUSTER_AT=4, lastKey='';

// 最初に見せる範囲＝束と単独スポットが全部おさまる大きさ
function homeView(){
  const pts=[];
  Object.keys(AREAS).forEach(a=>{ const c=centroid(areaSpots(a)); pts.push(NG_P(c[0],c[1])); });
  SPOTS.filter(s=>!AREAS[s.area]).forEach(s=>pts.push(NG_P(s.lon,s.lat)));
  return ngPZ.fit(pts,.22);
}

function drawNiigata(){
  const g=$('#ng-g'); g.innerHTML='';
  g.appendChild(el('path',{d:toPath(GEO.honshu,NG_P),class:'land-dim'}));
  g.appendChild(el('path',{d:toPath(GEO.sado,NG_P),class:'land-dim'}));
  g.appendChild(el('path',{d:toPath(GEO.niigata,NG_P),class:'land'}));
  const sd=el('text',{x:NG_P(138.36,38.18)[0],y:NG_P(138.36,38.18)[1],class:'lbl',
    fill:'#8E877B','font-size':'11','stroke-width':'2.5'}); sd.textContent='佐渡島'; g.appendChild(sd);
  g.appendChild(el('g',{id:'ng-trail'}));
  g.appendChild(el('g',{id:'ng-pins'}));
}

// 同じ場所にあって潰れるものは、地図の上だけ少しずらす（距離の計算には影響しない）
const MOFF={'ponshukan':[26,16],'niigata-sta':[-8,-10],'yahiko-rw':[-6,6]};
// ラベルのだいたいの幅（日本語は1文字ぶん、英数字は半分で見積もる）
function labelW(t){ let w=0; for(const c of t) w += /[\x20-\x7E]/.test(c)?5.6:11; return w; }

function renderPins(){
  const host=$('#ng-pins'); if(!host) return;
  host.innerHTML='';
  const k=ngPZ?ngPZ.st.k:1, inv=1/k;
  const day=state.day, plan=state.plan[day], base=baseOf(day);
  drawTrail();

  // --- どれを出すか決める ---
  const marks=[], inCluster=new Set();
  Object.keys(AREAS).forEach(a=>{
    const mem=areaSpots(a); if(mem.length<2) return;
    if(openAreas.has(a) || k>=CLUSTER_AT) return;
    mem.forEach(m=>inCluster.add(m.id));
    const c=centroid(mem), pt=NG_P(c[0],c[1]);
    marks.push({type:'cluster', area:a, x:pt[0], y:pt[1], r:23,
      label:AREAS[a].name, sub:'つまんで開く', n:mem.length,
      pick:mem.some(m=>plan.includes(m.id)), base:mem.some(m=>m.id===base)});
  });
  SPOTS.forEach(sp=>{
    if(inCluster.has(sp.id)) return;
    const pt=NG_P(sp.lon,sp.lat), off=MOFF[sp.id]||[0,0];
    marks.push({type:'pin', sp, x:pt[0]+off[0]*inv, y:pt[1]+off[1]*inv, r:19,
      label:SHORT[sp.id]||sp.name, idx:plan.indexOf(sp.id),
      shut:isShut(sp,day), base:sp.id===base});
  });

  // --- ラベルが重ならない置き場所を探す（下→上→さらに下…）---
  const boxes=marks.map(m=>({x0:m.x*k-m.r-2, x1:m.x*k+m.r+2, y0:m.y*k-m.r-2, y1:m.y*k+m.r+2}));
  const hit=b=>boxes.some(o=>!(b.x1<o.x0||b.x0>o.x1||b.y1<o.y0||b.y0>o.y1));
  // 画面の外に文字がはみ出す置き方は選ばない
  const VB=ngPZ?ngPZ.vb:[400,620], sx=ngPZ?ngPZ.st.x:0, sy=ngPZ?ngPZ.st.y:0;
  const outside=b=>(b.x0+sx<4||b.x1+sx>VB[0]-4||b.y0+sy<4||b.y1+sy>VB[1]-4);
  marks.forEach(m=>{
    const w=labelW(m.label+(m.sub?' ‧ つまんで開く':'')), h=13;
    const R=m.r, side=w/2+R+6;
    // 下 → 上 → もっと下 → もっと上 → 右 → 左 → さらに外側
    const cands=[];
    if(m.sp && LDY[m.sp.id]!=null) cands.push([0,LDY[m.sp.id]]);
    cands.push([0,R+15],[0,-(R+11)],[0,R+30],[0,-(R+26)],[side,5],[-side,5],
               [0,R+45],[0,-(R+41)],[side,-16],[-side,-16],[side,26],[-side,26]);
    for(const [dx,dy] of cands){
      const b={x0:m.x*k+dx-w/2, x1:m.x*k+dx+w/2, y0:m.y*k+dy-h, y1:m.y*k+dy+3};
      if(!hit(b) && !outside(b)){ m.ldx=dx; m.ldy=dy; boxes.push(b); break; }
    }
  });

  // --- 描く ---
  marks.forEach(m=>{
    if(m.type==='cluster'){
      const g=el('g',{class:'cluster',transform:`translate(${m.x} ${m.y}) scale(${inv})`});
      const r=el('circle',{class:'cring',cx:0,cy:0,r:m.r});
      if(m.pick) r.setAttribute('stroke','#C97B4E');
      g.appendChild(r);
      if(m.base) g.appendChild(el('circle',{cx:0,cy:0,r:m.r+6,fill:'none',stroke:'#23211E','stroke-width':1.6,'stroke-dasharray':'3 3'}));
      const t=el('text',{class:'cn',x:0,y:1}); t.textContent=m.n; g.appendChild(t);
      if(m.ldy!=null){
        const l=el('text',{class:'cl',x:m.ldx||0,y:m.ldy}); l.textContent=m.label+' ‧ つまんで開く'; g.appendChild(l);
      }
      g.addEventListener('click',ev=>{ ev.stopPropagation(); if(ngPZ.moved) return; openArea(m.area); });
      host.appendChild(g);
    }else{
      const sp=m.sp;
      const g=el('g',{class:'pin'+(m.idx>=0?' picked':'')+(m.shut?' shut':''),
        transform:`translate(${m.x} ${m.y}) scale(${inv})`});
      const col=m.idx>=0?'#C97B4E':(SIG_COLOR[sp.sig]||'#B0AAA0');
      const ring=el('circle',{class:'ring',cx:0,cy:0,r:m.r}); ring.setAttribute('stroke',col); g.appendChild(ring);
      if(m.idx>=0){ const n=el('text',{class:'num',x:0,y:1}); n.textContent=m.idx+1; g.appendChild(n); }
      else { const e=el('text',{class:'em',x:0,y:1}); e.textContent=sp.emoji; g.appendChild(e); }
      if(m.base) g.appendChild(el('circle',{cx:0,cy:0,r:m.r+6,fill:'none',stroke:'#23211E','stroke-width':1.6,'stroke-dasharray':'3 3'}));
      if(m.ldy!=null){ const nm=el('text',{class:'nm',x:m.ldx||0,y:m.ldy}); nm.textContent=m.label; g.appendChild(nm); }
      g.addEventListener('click',ev=>{ ev.stopPropagation(); if(ngPZ.moved) return; openSpot(sp.id); });
      host.appendChild(g);
    }
  });
}

// 束をひらく：その中身がちょうど画面に収まるところまで寄る
function openArea(a){
  openAreas.add(a); lastKey='';
  const v=ngPZ.fit(areaSpots(a).map(s=>NG_P(s.lon,s.lat)),.13);
  renderPins(); ngPZ.set(v,true,680);
}

// ズーム中はピンを作り直さず、大きさだけ書き換える（カクつき防止）
function updatePinScale(){
  const host=$('#ng-pins'); if(!host||!ngPZ) return;
  const inv=1/ngPZ.st.k;
  [...host.children].forEach(c=>{
    const m=(c.getAttribute('transform')||'').match(/translate\(([-\d.]+) ([-\d.]+)\)/);
    if(m) c.setAttribute('transform',`translate(${m[1]} ${m[2]}) scale(${inv})`);
  });
}

function drawTrail(){
  const host=$('#ng-trail'); if(!host) return; host.innerHTML='';
  const seq=[startOf(state.day),...state.plan[state.day]];
  if(seq.length<2) return;
  const pts=seq.map(id=>byId[id]).filter(Boolean).map(s=>NG_P(s.lon,s.lat));
  const pa=el('path',{d:toPath(pts,(a,b)=>[a,b],false),class:'trail'});
  pa.setAttribute('stroke-width',(2.2/(ngPZ?ngPZ.st.k:1)).toFixed(2));
  pa.setAttribute('stroke-dasharray',(5/(ngPZ?ngPZ.st.k:1)).toFixed(2)+' '+(5/(ngPZ?ngPZ.st.k:1)).toFixed(2));
  host.appendChild(pa);
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen=n=>n?n.toLocaleString()+'円':'0円';
const hhmm=m=>m>=60?`${Math.floor(m/60)}時間${m%60?m%60+'分':''}`:`${m}分`;
const gmap=(a,b)=>`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(a)}&destination=${encodeURIComponent(b)}&travelmode=transit`;

/* --- 観光地カード --- */
let curSpot=null;
function openSpot(id){
  const sp=byId[id]; if(!sp) return; curSpot=id;
  const day=state.day, D=dayOf(day), shut=isShut(sp,day);
  const inPlan=state.plan[day].indexOf(id);
  const base=baseOf(day);
  const sigTxt={green:'駅や本数の多いバスで行ける',yellow:'乗り継ぎと時刻の確認が要る',white:'タクシーがないと厳しい'}[sp.sig];
  const sigCls={green:'g',yellow:'y',white:'w'}[sp.sig];

  let h=`<div class="sp-head">
    <div class="sp-em">${sp.emoji}</div>
    <div class="sp-t"><h2>${esc(sp.name)}</h2><div class="tag">${esc(sp.tag)}</div></div>
  </div>
  <div class="badges">
    <span class="badge">${esc(sp.cat)}</span>
    <span class="badge ${sigCls}">${sigTxt}</span>
    ${shut?`<span class="badge x">${D.date}（${D.wdName}）は休み</span>`:''}
    ${sp.stay!=='—'?`<span class="badge">滞在 ${esc(sp.stay)}</span>`:''}
  </div>
  <p class="why">${esc(sp.why)}</p>`;

  const facts=[...(sp.facts||[])];
  if(sp.fee!=='—') facts.unshift(['料金',sp.fee]);
  if(sp.hours!=='—') facts.unshift(['時間',sp.hours]);
  if(facts.length){
    h+=`<div class="facts">`+facts.map(f=>`<div class="fact"><div class="fk">${esc(f[0])}</div><div class="fv">${esc(f[1])}</div></div>`).join('')+`</div>`;
  }
  if(sp.note) h+=`<div class="note${shut?' bad':''}">${esc(sp.note)}</div>`;
  if(sp.tip) h+=`<div class="note">💡 ${esc(sp.tip)}</div>`;

  if(sp.base && id===base && !state.plan[day].length){
    h+=`<div class="note">ここが ${D.label}（${D.date}）の出発地です。地図から次の行き先を選んでください。</div>`;
  }else if(inPlan>=0){
    h+=`<div class="btnrow">
      <button class="btn s" onclick="showRoute('${esc(inPlan===0?startOf(day):state.plan[day][inPlan-1])}','${esc(id)}')">この区間の行き方</button>
    </div>
    <button class="btn d" onclick="removeStop(${inPlan})">${D.label}の ${inPlan+1}番目 から外す</button>`;
  }else if(id!==base){
    h+=`<button class="btn p" onclick="showRoute('${esc(base)}','${esc(id)}')">
      ここまでの行き方をくらべる<br><span style="font-size:11.5px;font-weight:500;opacity:.85">${esc(byId[base].name)} から</span></button>`;
  }
  $('#sheet-body').innerHTML=h;
  $('#rsheet').classList.remove('on');
  openSheet('sheet');
}

/* --- 行き方をくらべるカード --- */
let pendingTo=null;
function showRoute(fromId,toId){
  const A=byId[fromId], B=byId[toId]; if(!A||!B) return;
  pendingTo=toId;
  const day=state.day, D=dayOf(day);
  const opts=routesBetween(fromId,toId);
  const already=state.plan[day].includes(toId);
  const byTime=opts.slice().sort((a,b)=>a.min-b.min);
  const noTaxi=byTime.filter(o=>o.mode!=='taxi' && !/タクシー/.test(o.label));
  const rec=(noTaxi.length?noTaxi:byTime)[0];                 // しおりが使う一本
  const fastest=byTime[0];
  const cheapest=byTime.slice().sort((a,b)=>(a.yen||0)-(b.yen||0))[0];
  const order=rec?[rec,...byTime.filter(o=>o!==rec)]:byTime;  // おすすめを先頭に

  let h=`<div class="rt-head">
    <div class="ab"><span>${esc(A.name)}</span><span class="ar">→</span><span>${esc(B.name)}</span></div>
    <div class="sm">${D.label}・${D.date}（${D.wdName}）の移動</div>
  </div>`;

  if(!opts.length){
    h+=`<div class="note bad">公共交通での行き方のデータがありません。下のボタンから乗換案内で調べてください。</div>`;
  }
  order.forEach(o=>{
    const isRec=o===rec, multi=opts.length>1;
    let crown='';
    if(isRec) crown='<span class="opt-crown">おすすめ</span>';
    else if(multi && o===cheapest) crown='<span class="opt-crown" style="background:#5F8A61">いちばん安い</span>';
    else if(multi && o===fastest) crown='<span class="opt-crown" style="background:#8A8379">いちばん速い</span>';
    h+=`<div class="opt${isRec?' best':''}">
      <div class="opt-top">
        <div class="opt-ic">${MODE_ICON[o.mode]||'🚃'}</div>
        <div class="opt-nm">${esc(o.label)}</div>
        ${crown}
      </div>
      <div class="opt-num">
        <div><span class="u">かかる時間</span><span class="n">${hhmm(o.min)}</span></div>
        <div><span class="u">運賃（ひとり）</span><span class="n">${o.yen?o.yen.toLocaleString():'0'}<small>円</small></span></div>
        <div><span class="u">ふたり分</span><span class="n">${o.yen?(o.yen*2).toLocaleString():'0'}<small>円</small></span></div>
      </div>`;
    if(o.legs) h+=o.legs.map(l=>`<div class="leg"><span class="li">${l.i}</span><span><b>${esc(l.t)}</b><br><span style="color:var(--muted)">${esc(l.s)}</span></span></div>`).join('');
    if(o.detail) h+=`<div class="opt-det">${esc(o.detail)}</div>`;
    if(o.times&&o.times.length) h+=`<div class="times">${o.times.map(t=>`<span class="tm">🕐 ${esc(t)}</span>`).join('')}</div>`;
    if(o.back&&o.back.length) h+=`<div class="times">${o.back.map(t=>`<span class="tm" style="background:#EDEAE4;color:var(--muted)">↩ ${esc(t)}</span>`).join('')}</div>`;
    if(o.warn) h+=`<div class="opt-warn">⚠️ ${esc(o.warn)}</div>`;
    if(o.est) h+=`<div class="opt-warn" style="background:#EFEDE8;color:var(--muted)">この数字は目安です。当日の乗換案内で確かめてください</div>`;
    h+=`</div>`;
  });

  if(!already && toId!==baseOf(day)){
    h+=`<button class="btn p" onclick="addStop('${esc(toId)}')">${D.label}の ${state.plan[day].length+1}番目 に決める</button>`;
  }
  h+=`<a class="btn s" href="${gmap(A.name+' 新潟',B.name+' 新潟')}" target="_blank" rel="noopener">Googleマップで当日の時刻を見る</a>`;
  h+=`<div class="estnote">時間と運賃は2026年8月時点で調べたものです。ダイヤ改定や当日の運行状況で変わることがあるので、出発前に乗換案内でもう一度確かめてください。運賃はICカード利用時のものを含みます。</div>`;

  $('#rsheet-body').innerHTML=h;
  $('#sheet').classList.remove('on');
  openSheet('rsheet');
  $('#rsheet-body').scrollTop=0;
}

function addStop(id){
  if(!state.plan[state.day].includes(id)) state.plan[state.day].push(id);
  save(); closeSheets(); updateFrom(); renderPins(); renderPlan();
  goto('plan');
}
function removeStop(i){
  state.plan[state.day].splice(i,1); save(); closeSheets(); updateFrom(); renderPins(); renderPlan();
}
window.showRoute=showRoute; window.addStop=addStop; window.removeStop=removeStop; window.openSpot=openSpot;

/* ============================================================
   しおり（積み上がった行き先）
   ============================================================ */
function renderPlan(){
  const day=state.day, D=dayOf(day), plan=state.plan[day], startId=startOf(day);
  const seq=[startId,...plan];
  let totMin=0, totYen=0;
  const hops=[];
  for(let i=1;i<seq.length;i++){
    const r=bestRoute(seq[i-1],seq[i]);
    hops.push(r);
    if(r){ totMin+=r.min; totYen+=(r.yen||0); }
  }

  let h=`<div class="sum">
    <div class="sumcard"><div class="k">行き先</div><div class="v">${plan.length}<small>か所</small></div></div>
    <div class="sumcard"><div class="k">移動の時間</div><div class="v">${totMin?hhmm(totMin):'—'}</div></div>
    <div class="sumcard"><div class="k">交通費 ふたり</div><div class="v">${totYen?(totYen*2).toLocaleString():'0'}<small>円</small></div></div>
  </div>`;

  if(!plan.length){
    h+=`<div class="empty"><span class="e">🗺</span>
      <p>${D.label}（${D.date} ${D.wdName}）は<br>まだ行き先が入っていません。<br>
      <b>${esc(byId[startId].name)}</b> を出発点にして、<br>地図から一つめを選んでください。</p></div>`;
    $('#plan-body').innerHTML=h; return;
  }

  h+=`<div class="tl">`;
  seq.forEach((id,i)=>{
    const sp=byId[id];
    if(i>0){
      const r=hops[i-1];
      h+=`<div class="hop">`;
      if(r){
        h+=`<span class="m">${MODE_ICON[r.mode]||'🚃'}</span><b>${esc(r.label)}</b> ・ <b>${hhmm(r.min)}</b> ・ <b>${yen(r.yen)}</b>（ひとり）`;
        if(r.times&&r.times.length) h+=`<span class="alt">🕐 ${r.times.map(esc).join(' / ')}</span>`;
        if(r.warn) h+=`<span class="alt" style="color:#8C6A21">⚠️ ${esc(r.warn)}</span>`;
      }else{
        h+=`<span class="m">❓</span>行き方のデータがありません`;
      }
      h+=`</div>`;
    }
    const shut=isShut(sp,day);
    h+=`<div class="node">
      <div class="dot${i===0?' st':''}">${i===0?'発':i}</div>
      <div class="card" onclick="openSpot('${esc(id)}')">
        <span class="e">${sp.emoji}</span>
        <span><span class="nm">${esc(sp.name)}</span>
        <span class="sm">${i===0?'ここから出発':esc(sp.tag)}${shut?' ・ ⚠️この日は休み':''}</span></span>
        ${i>0?`<span class="x" onclick="event.stopPropagation();removeStop(${i-1})">✕</span>`:''}
      </div>
    </div>`;
  });
  h+=`</div>`;

  if(day==='d1' && plan.length){
    h+=`<div class="note" style="margin-top:18px">🌙 1日目の最後にいる <b>${esc(byId[plan[plan.length-1]].name)}</b> が、そのまま2日目の出発地になります。ここが泊まる場所になる想定です。</div>`;
  }
  h+=`<div class="estnote" style="padding:0 2px">交通費は各区間の「おすすめ」の行き方で計算しています。ほかの行き方を選ぶ場合は、区間をタップして確かめてください。</div>`;
  $('#plan-body').innerHTML=h;
}

/* ============================================================
   日付タブ・画面の切り替え
   ============================================================ */
function buildTabs(sel){
  const host=$(sel); host.innerHTML='';
  DAYS.forEach(d=>{
    const b=document.createElement('button');
    b.className='daytab'+(d.id===state.day?' on':'');
    b.innerHTML=`${d.label}<span class="dd">${d.date}（${d.wdName}）</span>`;
    b.onclick=()=>{ state.day=d.id; save(); buildTabs('#daytabs'); buildTabs('#daytabs2');
      updateFrom(); renderPins(); renderPlan(); };
    host.appendChild(b);
  });
}
function updateFrom(){
  const b=byId[baseOf(state.day)];
  $('#from-name').textContent=b?b.name:'—';
  const n=state.plan[state.day].length;
  $('#from-n').textContent=n?`${n}か所め まで決定`:'出発地';
}

let cur='japan';
function goto(name){
  cur=name;
  $('#s-japan').classList.toggle('out',name!=='japan');
  $('#s-map').classList.toggle('out',name!=='map');
  $('#s-plan').classList.toggle('out',name!=='plan');
  $('#tabbar').classList.toggle('hide',name==='japan');
  $$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.go===name));
  if(name==='map'){ updateFrom(); renderPins(); }
  if(name==='plan') renderPlan();
}
$$('.tab').forEach(t=>t.onclick=()=>goto(t.dataset.go));
$('#btn-add').onclick=()=>goto('map');
$('#btn-back').onclick=()=>{ goto('japan'); jpPZ.reset(false); };
$('#btn-fit').onclick=()=>{ openAreas.clear(); lastKey=''; ngPZ.reset(true); renderPins(); };
$('#btn-share').onclick=()=>{
  const day=state.day, D=dayOf(day), seq=[startOf(day),...state.plan[day]];
  let txt=`【にいがた旅しおり】${D.label} ${D.date}（${D.wdName}）\n`;
  seq.forEach((id,i)=>{
    if(i>0){ const r=bestRoute(seq[i-1],seq[i]);
      if(r) txt+=`   ↓ ${r.label} ${hhmm(r.min)} / ${yen(r.yen)}\n`; }
    txt+=`${i===0?'発':i+'.'} ${byId[id].name}\n`;
  });
  if(navigator.share) navigator.share({text:txt}).catch(()=>{});
  else if(navigator.clipboard){ navigator.clipboard.writeText(txt); alert('しおりをコピーしました'); }
};

/* ============================================================
   はじめる
   ============================================================ */
const jpPZ=makePanZoom('#jp-wrap','#jp-g',JP_VB,{min:.9,max:9,past:2.4,onZoomPast:()=>enterNiigata()});
$('#jp-wrap').addEventListener('click',()=>{ if(!jpPZ.moved) enterNiigata(); });

let entering=false;
function enterNiigata(){
  if(entering) return; entering=true;
  const c=JP_P(138.95,37.65);
  jpPZ.zoomTo(c[0],c[1],6,700);
  setTimeout(()=>{ goto('map'); setTimeout(()=>{ jpPZ.reset(false); entering=false; },520); },680);
}

drawNiigata();
ngPZ=makePanZoom('#ng-wrap','#ng-g',NG_VB,{min:.6,max:90,home:homeView,onChange:st=>{
  // 十分に引いたら、開いていた束をまた閉じる
  {
    [...openAreas].forEach(a=>{
      const v=ngPZ.fit(areaSpots(a).map(s=>NG_P(s.lon,s.lat)),.13);
      if(st.k < v.k*0.5) openAreas.delete(a);
    });
  }
  const key=[...openAreas].sort().join(',')+'|'+(st.k>=CLUSTER_AT);
  if(key!==lastKey){ lastKey=key; renderPins(); } else updatePinScale();
  const zh=$('#zoomhint'); if(zh) zh.style.opacity = (openAreas.size||st.k>=CLUSTER_AT)?0:1;
},onEnd:()=>{ lastKey=''; renderPins(); }});
// 束をまとめる境目は、最初に見せる大きさを基準に決める
CLUSTER_AT = homeView().k * 1.9;
ngPZ.reset(false);
buildTabs('#daytabs'); buildTabs('#daytabs2');
updateFrom(); renderPins(); renderPlan();
</script>
</body>
</html>
